# DRAFT quiz bank: drafted by Claude (2026-10-14), NOT reviewed by the project owner.
# The owner must review every question and every option level before this bank is trusted:
# check that the situation is realistic, that each option's hidden level (0-4, the shared level scale)
# matches what the option shows about the person, and that wrong-sounding options are not obviously wrong.
# Once reviewed, remove this header. Levels are hidden: they never leave the server.
version: 1
questions:
  - id: context-engineering-1
    skill_id: context-engineering
    situation: >-
      You start using a coding agent on an existing repo, and it keeps running the wrong test command and
      ignoring your folder conventions. You want it to get these right from the first message of every session.
    options:
      - text: "Write the test command and the folder conventions into a root CLAUDE.md and prune it each month."
        level: 2
      - text: "Move the folder rules into nested CLAUDE.md files and regenerate the test command from the manifest on commit."
        level: 4
      - text: "Add the test script name and the folder rules to a saved prompt and paste it at the start of each new session."
        level: 0
      - text: "Split the conventions into the root CLAUDE.md and nested files per package, then try each in a fresh session."
        level: 3
      - text: "Generate a CLAUDE.md with the init command and commit it with most of the generated defaults kept."
        level: 1
  - id: context-engineering-2
    skill_id: context-engineering
    situation: >-
      Two hours into a long session the agent starts forgetting decisions made earlier and repeats mistakes
      you already corrected. The context window is nearly full.
    options:
      - text: "Ask the agent to save the decisions to a notes file, then start a fresh session that reads the file first."
        level: 2
      - text: "Keep working in the same session and restate each earlier decision in a new prompt whenever the agent drifts."
        level: 0
      - text: "Keep a running log of choices in CLAUDE.md that the agent appends to and rereads at the start of each chat."
        level: 3
      - text: "Run compact with a note listing the decisions that must survive, then continue in the same session."
        level: 2
  - id: cc-skills-commands-1
    skill_id: cc-skills-commands
    situation: >-
      You paste the same long prompt for reviewing pull requests several times a week. A colleague says
      this should be saved somewhere reusable instead of living in your notes.
    options:
      - text: "Turn the prompt into a skill with a rubric file and a small helper command that fetches the PR diff."
        level: 3
      - text: "Save the prompt in a shell script that prints it, and paste the output into a clean chat for each review."
        level: 0
      - text: "Turn the prompt into a slash command file with a PR number argument and check it into the repo."
        level: 2
      - text: "Pick a published review command from a plugin marketplace and run it with the default settings."
        level: 1
      - text: "Limit the tool list in the command's front matter to the git and gh calls that read the PR."
        level: 3
  - id: cc-skills-commands-2
    skill_id: cc-skills-commands
    situation: >-
      A skill you wrote is never picked up by the agent, even when you ask for exactly the task it was
      written for. Other skills in the same folder load fine.
    options:
      - text: "Use debug mode to see if the skill gets registered, then fix the front matter or the description."
        level: 3
      - text: "Compare the skill front matter with the example in the docs and fix any field that does not match."
        level: 1
      - text: "Rename the skill folder to match the task wording and test again with the same prompt in a new session."
        level: 0
      - text: "Reword the description in the skill front matter to state when it applies, then retry the task."
        level: 2
  - id: cc-hooks-1
    skill_id: cc-hooks
    situation: >-
      Your team keeps committing code that skips the formatter because the coding agent edits files
      directly. You want formatting to happen every time without relying on the agent remembering.
    options:
      - text: "Make the PostToolUse hook return formatter errors to the agent and require a fix before it finishes."
        level: 3
      - text: "Paste the documented PostToolUse formatter example into settings.json and keep its default matcher."
        level: 1
      - text: "Put the formatter in a git pre-commit step that runs on every commit, whoever made the edit."
        level: 4
      - text: "Format the code manually before each commit and check the diff for any files the formatter changed."
        level: 0
      - text: "Add a PostToolUse hook that formats the edited file, with the command changed to the team formatter."
        level: 2
  - id: cc-hooks-2
    skill_id: cc-hooks
    situation: >-
      The agent must never run destructive shell commands such as forced pushes or deleting outside the
      project, even when it is running unattended and nobody can approve prompts.
    options:
      - text: "Use a PreToolUse hook on the shell tool that matches the risky commands and blocks them with a message."
        level: 3
      - text: "Skip the permission prompts for the run and check the git reflog for any forced pushes once it is done."
        level: 0
      - text: "Run the agent in a throwaway VM with the project files and none of the keys needed to push."
        level: 4
      - text: "List deny rules in the project settings for git force push and rm outside the project directory."
        level: 2
      - text: "Add a line to the agent instructions forbidding force push and deletes outside the project."
        level: 1
  - id: cc-subagents-1
    skill_id: cc-subagents
    situation: >-
      You ask the agent to find every place a deprecated function is used across a big monorepo. The main
      conversation fills up with search output before it can start the actual migration.
    options:
      - text: "Have a subagent list the deprecated call sites in JSON, then hand each file to a migration subagent."
        level: 4
      - text: "Ask the agent to run the search in a subagent that returns only file paths and line numbers."
        level: 2
      - text: "Write a grep script that prints every match into the main conversation, then check each hit by hand."
        level: 0
      - text: "Keep a search agent file with read-only tools and a short output format, and reuse it across repos."
        level: 3
      - text: "Clear the conversation and rerun the search with a narrower grep pattern and a smaller directory scope."
        level: 1
  - id: cc-subagents-2
    skill_id: cc-subagents
    situation: >-
      A custom agent you defined keeps wandering outside its job: it edits files when it should only review,
      and its summaries come back too long to be useful.
    options:
      - text: "Give the agent read-only tools and a SubagentStop hook that sends long summaries back for a rewrite."
        level: 3
      - text: "Add a line to the agent prompt that says review only and keep every summary under ten lines."
        level: 1
      - text: "Remove the edit tools from the agent file's tool list and cap the summary length in its prompt."
        level: 2
      - text: "Split it into a read-only reviewer with a fixed template for the summary and a fixer subagent that edits."
        level: 3
  - id: cc-plugins-1
    skill_id: cc-plugins
    situation: >-
      You have a few skills, a hook and a custom agent that work well on your machine. Three colleagues
      want the same setup and you do not want to send them files to copy by hand.
    options:
      - text: "Share the plugin with the colleagues through a team marketplace, pinning a version per release."
        level: 3
      - text: "Push the whole .claude folder to a shared dotfiles repo and have each colleague clone it over their own."
        level: 0
      - text: "Derive the plugin and its marketplace entry from the skill and hook folders on each tagged release."
        level: 3
      - text: "Bundle the skills, hook and agent into a plugin with its own manifest and install it from the repo."
        level: 2
  - id: cc-plugins-2
    skill_id: cc-plugins
    situation: >-
      A plugin you ship to the team updated its hook last week and now some colleagues report broken
      sessions while others see nothing wrong.
    options:
      - text: "Hold each release of the plugin until CI installs it into a clean profile on every OS the team uses."
        level: 4
      - text: "Ask affected colleagues to delete their plugin folder, reinstall it from the marketplace and rerun the hook."
        level: 0
      - text: "Compare plugin versions per colleague config and roll back the hook for the broken setups."
        level: 2
      - text: "Follow the update steps in the install docs and check the version in each colleague's plugin manifest."
        level: 1
      - text: "Keep the marketplace entry for the plugin pinned to tagged releases, with a changelog for rollbacks."
        level: 3
  - id: cc-mcp-usage-1
    skill_id: cc-mcp-usage
    situation: >-
      You want the coding agent to read issues from your tracker and look at the production database schema
      without you copying text into the chat.
    options:
      - text: "Point the database server at a read replica with a least-privilege user and disable its write tools."
        level: 3
      - text: "Export tracker issues and a schema dump to files in the repo each week and require the agent to read them."
        level: 0
      - text: "Connect both servers in a shared .mcp.json file and keep each credential in its own environment variable."
        level: 2
      - text: "Set rules in settings that allow tracker reads and prompt for approval on each database query."
        level: 2
      - text: "Add the tracker server with the command from its README and sign in when the browser prompts."
        level: 1
  - id: cc-mcp-usage-2
    skill_id: cc-mcp-usage
    situation: >-
      After connecting five MCP servers, the agent is slower, picks the wrong tools, and your context fills up
      before you have typed anything.
    options:
      - text: "Move most servers into per-project config files, loading only the ones each repo uses."
        level: 2
      - text: "Use one small proxy in front of the servers that exposes a few curated tools to the agent."
        level: 4
      - text: "Go through the troubleshooting page for each server and check the entries that start slowly."
        level: 1
      - text: "Compare the tokens each server's tool list adds and replace the heaviest ones within a set budget."
        level: 3
      - text: "Disable rarely used servers and tools in settings and keep the two or three needed for the current task."
        level: 2
  - id: cc-headless-ci-1
    skill_id: cc-headless-ci
    situation: >-
      You want the agent to summarize failing tests in a short comment on every pull request, with no one
      sitting at a terminal.
    options:
      - text: "Run the agent with JSON output, a turn limit and a tool allowlist that lets it post the comment itself."
        level: 3
      - text: "Add a CI job that runs the agent with every tool allowed and posts its JSON output in the comment."
        level: 0
      - text: "Run the agent with read tools, a max-turns flag and no comment token, then post the JSON in a later job."
        level: 4
      - text: "Add a CI step that runs claude -p with a short prompt and a limited tool list, then posts the output."
        level: 2
      - text: "Take the example workflow from the docs, add the API token secret, and limit it to pull request events."
        level: 1
  - id: cc-headless-ci-2
    skill_id: cc-headless-ci
    situation: >-
      You want a nightly job that triages new issues and opens draft pull requests for the easy ones, running
      on a schedule rather than on someone's laptop.
    options:
      - text: "Split the triage and the edits into two runs with different tokens, giving the triage run read-only access."
        level: 3
      - text: "Start from the scheduled workflow example in the docs and swap in a triage prompt and API key secret."
        level: 1
      - text: "Record the outcome and cost of each nightly run in a log, and alert on errors or unusually high spend."
        level: 3
      - text: "Add a nightly job that feeds every open issue to the agent in one long prompt and opens a PR per reply."
        level: 0
      - text: "Add a scheduled workflow with a bounded prompt and a cost cap that opens draft PRs for the easy fixes."
        level: 2
  - id: parallel-agents-1
    skill_id: parallel-agents
    situation: >-
      You want to try two different approaches to the same feature and keep working on a small bugfix at the
      same time, all with coding agents.
    options:
      - text: "Create a git worktree per approach and for the bugfix, run one agent in each, and diff the approaches."
        level: 2
      - text: "Write a worktree setup step that gives each agent its own dev server port and a separate database."
        level: 3
      - text: "Open a terminal tab per task and start an agent in each, all working in the one shared checkout."
        level: 1
      - text: "Run all three tasks in one agent session on the same branch and check its progress on each in turn."
        level: 0
      - text: "Clone the repo again into two sibling folders and run one agent in each of the three clones."
        level: 1
  - id: parallel-agents-2
    skill_id: parallel-agents
    situation: >-
      Three parallel agent sessions are running. Two of them have started editing the same configuration file,
      and a third is waiting for input you did not notice.
    options:
      - text: "Assign each session an owned set of files and give the shared config to exactly one of them."
        level: 3
      - text: "Stop two of the sessions and restart them one at a time to avoid collisions on the config file."
        level: 1
      - text: "Use the multiplexer status view to spot stalled sessions and add an alert for any session that goes idle."
        level: 3
      - text: "Compare each worktree diff, resolve the shared file by hand, and enable alerts for blocked sessions."
        level: 2
  - id: spec-driven-workflow-1
    skill_id: spec-driven-workflow
    situation: >-
      You are about to ask a coding agent to build a feature that touches the database, the API and the UI.
      The first attempt last time produced a lot of code that did not match what you had in mind.
    options:
      - text: "Write a short spec with behavior and test cases, have the agent derive a plan, and review both."
        level: 2
      - text: "Describe the feature with its schema and UI mockups in a first prompt and let the agent build it."
        level: 0
      - text: "Encode the spec in failing acceptance tests before the plan and accept each task once the tests pass."
        level: 4
      - text: "Ask the agent for a plan before coding and check it for obvious gaps before approving it in the chat."
        level: 1
      - text: "Break the plan into small database, API and UI tasks with acceptance criteria and a fresh session each."
        level: 3
  - id: spec-driven-workflow-2
    skill_id: spec-driven-workflow
    situation: >-
      Halfway through executing a plan, the agent discovers that a library does not support what the spec
      assumed. Several tasks depend on that assumption.
    options:
      - text: "Add a preflight script to the plan template that checks each library assumption before the run."
        level: 3
      - text: "Let the agent pick a replacement library on its own and keep executing remaining tasks in the plan."
        level: 0
      - text: "Add the new constraint to the spec and revise only dependent tasks after pausing execution."
        level: 2
      - text: "Stop the run and write a small spike test against the library for each other assumption in the spec."
        level: 3
  - id: agent-verification-1
    skill_id: agent-verification
    situation: >-
      The agent says the feature is finished and all tests pass. You are about to merge.
    options:
      - text: "Run the tests, linter and type check on the branch and read the output before merging."
        level: 2
      - text: "Ignore the summary and merge on green exit codes from a CI job the agent cannot touch."
        level: 4
      - text: "Merge once the agent's summary says every test passes and reports no failed checks."
        level: 0
      - text: "Wire a Stop hook that runs the checks and returns any errors to the agent to fix."
        level: 3
      - text: "Confirm that the CI badge on the pull request is green and skim the diff before merging it."
        level: 1
  - id: agent-verification-2
    skill_id: agent-verification
    situation: >-
      You notice the agent made a failing test pass by loosening an assertion and adding a skip. It told
      you everything was green.
    options:
      - text: "Configure a hook that rejects edits to test files during implementation and route test changes to review."
        level: 3
      - text: "Revert the agent's commit and rerun the same task prompt until the suite comes back green."
        level: 0
      - text: "Base merges on a protected copy of the acceptance tests kept outside the agent's write access."
        level: 4
      - text: "Add a CI check that fails when skipped tests or assertion counts change against the base branch."
        level: 3
      - text: "Restore the test and add a line to the agent instructions forbidding weakened or skipped tests."
        level: 1
      - text: "Review test diffs separately from code diffs before each merge and reject any weakened assertion."
        level: 2
  - id: tool-use-loop-1
    skill_id: tool-use-loop
    situation: >-
      You need a small assistant that can call two of your own functions. You are asked not to add an agent
      framework, so you call the model API directly.
    options:
      - text: "Record real model API responses once and replay them through the loop to check each change."
        level: 3
      - text: "Write a prompt telling the model to reply with a JSON function name and arguments, parsed by a regex."
        level: 0
      - text: "Write the loop with a maximum turn count and handle several tool calls in one response."
        level: 2
      - text: "Check the arguments against each function schema and return the errors to the model in tool results."
        level: 3
      - text: "Implement the loop from the docs example, sending tool definitions and returning each function result."
        level: 1
  - id: tool-use-loop-2
    skill_id: tool-use-loop
    situation: >-
      Your hand-written loop sometimes fails with an error because the next request contains a tool result
      that does not match the tool call the model made.
    options:
      - text: "Print the message list before each request and compare tool call ids with result ids."
        level: 2
      - text: "Retry the request on failure and log the raw message list when it fails a second time."
        level: 1
      - text: "Add a check before the request that inserts an error result for each tool call with no result yet."
        level: 3
      - text: "Return exactly one result per tool call id in the next message, including a result when the tool throws."
        level: 2
  - id: agent-sdk-1
    skill_id: agent-sdk
    situation: >-
      You need an agent that reads files, runs commands and keeps its conversation between runs, and you
      would rather not write the tool loop yourself.
    options:
      - text: "Resume the session by id on each run and deny commands outside the folder in a permission callback."
        level: 3
      - text: "Set up the SDK from its quick-start example and swap in the project prompt and folder."
        level: 1
      - text: "Build the agent in a no-code pipeline tool with a separate node for reading files and one for the shell."
        level: 0
      - text: "Save the session id on disk for each project and compact the history when it grows too long."
        level: 3
      - text: "Build the agent with the SDK, restrict the allowed tools, and resume sessions by id on later runs."
        level: 2
  - id: agent-sdk-2
    skill_id: agent-sdk
    situation: >-
      Your SDK agent works on your machine, but when you deploy it as a service it should handle several
      users' tasks at once without them seeing each other's files.
    options:
      - text: "Give each user a separate working directory on the same server and a scoped API token."
        level: 2
      - text: "Run each task in a throwaway sandbox that gets user files from a tool checking the user id."
        level: 4
      - text: "Deploy the hosting example from the SDK docs in one container, with all tasks sharing its working directory."
        level: 1
      - text: "Give each session its own container with a private file system and delete it when the run ends."
        level: 3
  - id: mcp-server-build-1
    skill_id: mcp-server-build
    situation: >-
      Your team wants coding agents to query your internal deployment service. There is no ready-made MCP
      server for it.
    options:
      - text: "Shape the tools around tasks agents perform instead of mirroring every endpoint of the API."
        level: 3
      - text: "Generate a server from the OpenAPI spec with a template generator and keep its default tools."
        level: 1
      - text: "Write a shell script that wraps curl calls to the deployment API and let the agent run it."
        level: 0
      - text: "Serve the server over HTTP with auth, input validation, and error messages the model can act on."
        level: 3
      - text: "Build a small server with the official SDK exposing a few described tools over stdio, then test it."
        level: 2
  - id: mcp-server-build-2
    skill_id: mcp-server-build
    situation: >-
      Your MCP server works locally over stdio. Now remote teammates need it, and some of its tools
      must only be available to certain people.
    options:
      - text: "Serve it over HTTP with OAuth and derive the tool list and per-call checks from IdP groups."
        level: 4
      - text: "Switch to the HTTP transport and give each teammate an API key listed in a JSON file on the server."
        level: 2
      - text: "Share the repo and have each teammate run a local server with their own credentials."
        level: 1
      - text: "Serve it over HTTP with OAuth and check the caller's role inside each sensitive tool before it runs."
        level: 3
  - id: multi-agent-orchestration-1
    skill_id: multi-agent-orchestration
    situation: >-
      You are building a system that researches a topic, drafts a report and checks the draft's claims. One
      big prompt gives shallow, error-prone results.
    options:
      - text: "Build an orchestrator that fans research out to parallel workers, then runs a drafting agent."
        level: 2
      - text: "Switch the single prompt to a larger model with a longer context window and raise the token limit."
        level: 0
      - text: "Show the reviewing agent only the draft and its sources, and send failed claims back to research."
        level: 4
      - text: "Chain research, draft and check prompts manually, pasting each output into the next prompt in a shared doc."
        level: 1
      - text: "Wire a research step, a draft step and a checker together in code with fixed handoffs between them."
        level: 2
  - id: multi-agent-orchestration-2
    skill_id: multi-agent-orchestration
    situation: >-
      In your multi-agent pipeline, one worker sometimes returns confident but wrong output, and the next agent
      builds on it. By the end the final answer is wrong and hard to trace.
    options:
      - text: "Make each worker attach the source passages for its claims and have the next agent reject unsupported ones."
        level: 3
      - text: "Log each agent's input and output in JSON and trace back to the first step that failed."
        level: 2
      - text: "Repeat the pipeline run in a clean environment with a test input and compare the new answer with the old one."
        level: 1
      - text: "Run an independent verifier agent after the risky worker to check its claims against the sources."
        level: 3
  - id: human-in-the-loop-1
    skill_id: human-in-the-loop
    situation: >-
      Your app lets an agent send emails and delete records for users. Leadership wants a person to confirm
      anything that cannot be undone.
    options:
      - text: "Mark irreversible actions and resume the run only after a confirmation dialog on each of them."
        level: 2
      - text: "Put every tool call through the app's permission function, returning allow, ask or deny per user."
        level: 4
      - text: "Turn on the mail provider's undo-send delay and keep nightly backups to restore deleted records."
        level: 0
      - text: "Add a rule to the system prompt requiring the model to ask the user before any irreversible action."
        level: 1
      - text: "Enforce approval inside the tool code, save pending approvals in the database, and wait until resolved."
        level: 3
  - id: human-in-the-loop-2
    skill_id: human-in-the-loop
    situation: >-
      A user starts a long-running agent task in your app, then notices it is heading the wrong way and wants
      to stop it right away.
    options:
      - text: "Check a cancel flag in the loop between steps, and report the steps the run already completed."
        level: 2
      - text: "Kill the whole worker container from an admin page when a user reports that a run went the wrong way."
        level: 0
      - text: "Abort the in-flight request and tools when the user hits stop, and flag partial changes for review."
        level: 3
      - text: "Add a stop button that closes the connection to the model and ends the run immediately."
        level: 1
  - id: workflow-automation-1
    skill_id: workflow-automation
    situation: >-
      Every day someone copies new support emails into a spreadsheet and tags them by topic. You are asked
      to automate it with a tool that has language model steps.
    options:
      - text: "Send the low-confidence topic tags to a person for review and keep the tagging prompt in a variable."
        level: 3
      - text: "Start from a gallery template in the tool and connect the mail and spreadsheet accounts."
        level: 1
      - text: "Have one model step read the whole inbox each night and rewrite all of the spreadsheet from scratch."
        level: 0
      - text: "Test the workflow on a copy of the sheet with sample support emails and an alerting error branch."
        level: 3
      - text: "Set up the workflow with a new-mail trigger, a model prompt that tags the topic, and an append-row step."
        level: 2
  - id: workflow-automation-2
    skill_id: workflow-automation
    situation: >-
      An automation you built occasionally sends a customer the wrong template, because the model step sometimes
      returns text in a format the next node does not expect.
    options:
      - text: "Have the model step return an id from a fixed list and look up the template for it in code."
        level: 4
      - text: "Add a validation step that parses the output and routes any of the failures to a manual review queue."
        level: 2
      - text: "Tighten the prompt to require a strict output schema and include an example of the exact format."
        level: 1
      - text: "Add a structured output schema to the model step and a check on the template name before sending."
        level: 3
