# DRAFT quiz bank: drafted by Claude (2026-10-14), NOT reviewed by the project owner.
# The owner must review every question and every option level before this bank is trusted:
# check that the situation is realistic, that each option's hidden level (0-4, the shared level scale)
# matches what the option shows about the person, and that wrong-sounding options are not obviously wrong.
# Once reviewed, remove this header. Levels are hidden: they never leave the server.
version: 1
questions:
  - id: context-engineering-1
    skill_id: context-engineering
    situation: >-
      You start using a coding agent on an existing repo, and it keeps running the wrong test command and
      ignoring your folder conventions. You want it to get these right from the first message of every session.
    options:
      - text: "Write the test command and the folder conventions into a root CLAUDE.md and prune it each month."
        level: 2
      - text: "Move the folder rules into nested CLAUDE.md files and regenerate the test command from the manifest on commit."
        level: 4
      - text: "Add the test script name and the folder rules to a saved prompt and paste it at the start of each new session."
        level: 0
      - text: "Split the conventions into the root CLAUDE.md and nested files per package, then try each in a fresh session."
        level: 3
      - text: "Generate a CLAUDE.md with the init command and commit it with most of the generated defaults kept."
        level: 1
  - id: context-engineering-2
    skill_id: context-engineering
    situation: >-
      Two hours into a long session the agent starts forgetting decisions made earlier and repeats mistakes
      you already corrected. The context window is nearly full.
    options:
      - text: "Ask the agent to save the decisions to a notes file, then start a fresh session that reads the file first."
        level: 2
      - text: "Keep working in the same session and restate each earlier decision in a new prompt whenever the agent drifts."
        level: 0
      - text: "Keep a running log of choices in CLAUDE.md that the agent appends to and rereads at the start of each chat."
        level: 3
      - text: "Run compact with a note listing the decisions that must survive, then continue in the same session."
        level: 2
  - id: cc-skills-commands-1
    skill_id: cc-skills-commands
    situation: >-
      You paste the same long prompt for reviewing pull requests several times a week. A colleague says
      this should be saved somewhere reusable instead of living in your notes.
    options:
      - text: "Turn the prompt into a skill with a rubric file and a small helper command that fetches the PR diff."
        level: 3
      - text: "Save the prompt in a shell script that prints it, and paste the output into a clean chat for each review."
        level: 0
      - text: "Turn the prompt into a slash command file with a PR number argument and check it into the repo."
        level: 2
      - text: "Pick a published review command from a plugin marketplace and run it with the default settings."
        level: 1
      - text: "Limit the tool list in the command's front matter to the git and gh calls that read the PR."
        level: 3
  - id: cc-skills-commands-2
    skill_id: cc-skills-commands
    situation: >-
      A skill you wrote is never picked up by the agent, even when you ask for exactly the task it was
      written for. Other skills in the same folder load fine.
    options:
      - text: "Use debug mode to see if the skill gets registered, then fix the front matter or the description."
        level: 3
      - text: "Compare the skill front matter with the example in the docs and fix any field that does not match."
        level: 1
      - text: "Rename the skill folder to match the task wording and test again with the same prompt in a new session."
        level: 0
      - text: "Reword the description in the skill front matter to state when it applies, then retry the task."
        level: 2
  - id: cc-hooks-1
    skill_id: cc-hooks
    situation: >-
      Your team keeps committing code that skips the formatter because the coding agent edits files
      directly. You want formatting to happen every time without relying on the agent remembering.
    options:
      - text: "Make the PostToolUse hook return formatter errors to the agent and require a fix before it finishes."
        level: 3
      - text: "Paste the documented PostToolUse formatter example into settings.json and keep its default matcher."
        level: 1
      - text: "Put the formatter in a git pre-commit step that runs on every commit, whoever made the edit."
        level: 4
      - text: "Format the code manually before each commit and check the diff for any files the formatter changed."
        level: 0
      - text: "Add a PostToolUse hook that formats the edited file, with the command changed to the team formatter."
        level: 2
  - id: cc-hooks-2
    skill_id: cc-hooks
    situation: >-
      The agent must never run destructive shell commands such as forced pushes or deleting outside the
      project, even when it is running unattended and nobody can approve prompts.
    options:
      - text: "Use a PreToolUse hook on the shell tool that matches the risky commands and blocks them with a message."
        level: 3
      - text: "Skip the permission prompts for the run and check the git reflog for any forced pushes once it is done."
        level: 0
      - text: "Run the agent in a throwaway VM with the project files and none of the keys needed to push."
        level: 4
      - text: "List deny rules in the project settings for git force push and rm outside the project directory."
        level: 2
      - text: "Add a line to the agent instructions forbidding force push and deletes outside the project."
        level: 1
  - id: cc-subagents-1
    skill_id: cc-subagents
    situation: >-
      You ask the agent to find every place a deprecated function is used across a big monorepo. The main
      conversation fills up with search output before it can start the actual migration.
    options:
      - text: "Have a subagent list the deprecated call sites in JSON, then hand each file to a migration subagent."
        level: 4
      - text: "Ask the agent to run the search in a subagent that returns only file paths and line numbers."
        level: 2
      - text: "Write a grep script that prints every match into the main conversation, then check each hit by hand."
        level: 0
      - text: "Keep a search agent file with read-only tools and a short output format, and reuse it across repos."
        level: 3
      - text: "Clear the conversation and rerun the search with a narrower grep pattern and a smaller directory scope."
        level: 1
  - id: cc-subagents-2
    skill_id: cc-subagents
    situation: >-
      A custom agent you defined keeps wandering outside its job: it edits files when it should only review,
      and its summaries come back too long to be useful.
    options:
      - text: "Give the agent read-only tools and a SubagentStop hook that sends long summaries back for a rewrite."
        level: 3
      - text: "Add a line to the agent prompt that says review only and keep every summary under ten lines."
        level: 1
      - text: "Remove the edit tools from the agent file's tool list and cap the summary length in its prompt."
        level: 2
      - text: "Split it into a read-only reviewer with a fixed template for the summary and a fixer subagent that edits."
        level: 3
  - id: cc-plugins-1
    skill_id: cc-plugins
    situation: >-
      You have a few skills, a hook and a custom agent that work well on your machine. Three colleagues
      want the same setup and you do not want to send them files to copy by hand.
    options:
      - text: "Share the plugin with the colleagues through a team marketplace, pinning a version per release."
        level: 3
      - text: "Push the whole .claude folder to a shared dotfiles repo and have each colleague clone it over their own."
        level: 0
      - text: "Derive the plugin and its marketplace entry from the skill and hook folders on each tagged release."
        level: 3
      - text: "Bundle the skills, hook and agent into a plugin with its own manifest and install it from the repo."
        level: 2
  - id: cc-plugins-2
    skill_id: cc-plugins
    situation: >-
      A plugin you ship to the team updated its hook last week and now some colleagues report broken
      sessions while others see nothing wrong.
    options:
      - text: "Hold each release of the plugin until CI installs it into a clean profile on every OS the team uses."
        level: 4
      - text: "Ask affected colleagues to delete their plugin folder, reinstall it from the marketplace and rerun the hook."
        level: 0
      - text: "Compare plugin versions per colleague config and roll back the hook for the broken setups."
        level: 2
      - text: "Follow the update steps in the install docs and check the version in each colleague's plugin manifest."
        level: 1
      - text: "Keep the marketplace entry for the plugin pinned to tagged releases, with a changelog for rollbacks."
        level: 3
  - id: cc-mcp-usage-1
    skill_id: cc-mcp-usage
    situation: >-
      You want the coding agent to read issues from your tracker and look at the production database schema
      without you copying text into the chat.
    options:
      - text: "Point the database server at a read replica with a least-privilege user and disable its write tools."
        level: 3
      - text: "Export tracker issues and a schema dump to files in the repo each week and require the agent to read them."
        level: 0
      - text: "Connect both servers in a shared .mcp.json file and keep each credential in its own environment variable."
        level: 2
      - text: "Set rules in settings that allow tracker reads and prompt for approval on each database query."
        level: 2
      - text: "Add the tracker server with the command from its README and sign in when the browser prompts."
        level: 1
  - id: cc-mcp-usage-2
    skill_id: cc-mcp-usage
    situation: >-
      After connecting five MCP servers, the agent is slower, picks the wrong tools, and your context fills up
      before you have typed anything.
    options:
      - text: "Move most servers into per-project config files, loading only the ones each repo uses."
        level: 2
      - text: "Use one small proxy in front of the servers that exposes a few curated tools to the agent."
        level: 4
      - text: "Go through the troubleshooting page for each server and check the entries that start slowly."
        level: 1
      - text: "Compare the tokens each server's tool list adds and replace the heaviest ones within a set budget."
        level: 3
      - text: "Disable rarely used servers and tools in settings and keep the two or three needed for the current task."
        level: 2
  - id: cc-headless-ci-1
    skill_id: cc-headless-ci
    situation: >-
      You want the agent to summarize failing tests in a short comment on every pull request, with no one
      sitting at a terminal.
    options:
      - text: "Run the agent with JSON output, a turn limit and a tool allowlist that lets it post the comment itself."
        level: 3
      - text: "Add a CI job that runs the agent with every tool allowed and posts its JSON output in the comment."
        level: 0
      - text: "Run the agent with read tools, a max-turns flag and no comment token, then post the JSON in a later job."
        level: 4
      - text: "Add a CI step that runs claude -p with a short prompt and a limited tool list, then posts the output."
        level: 2
      - text: "Take the example workflow from the docs, add the API token secret, and limit it to pull request events."
        level: 1
  - id: cc-headless-ci-2
    skill_id: cc-headless-ci
    situation: >-
      You want a nightly job that triages new issues and opens draft pull requests for the easy ones, running
      on a schedule rather than on someone's laptop.
    options:
      - text: "Split the triage and the edits into two runs with different tokens, giving the triage run read-only access."
        level: 3
      - text: "Start from the scheduled workflow example in the docs and swap in a triage prompt and API key secret."
        level: 1
      - text: "Record the outcome and cost of each nightly run in a log, and alert on errors or unusually high spend."
        level: 3
      - text: "Add a nightly job that feeds every open issue to the agent in one long prompt and opens a PR per reply."
        level: 0
      - text: "Add a scheduled workflow with a bounded prompt and a cost cap that opens draft PRs for the easy fixes."
        level: 2
  - id: parallel-agents-1
    skill_id: parallel-agents
    situation: >-
      You want to try two different approaches to the same feature and keep working on a small bugfix at the
      same time, all with coding agents.
    options:
      - text: "Create a git worktree per approach and for the bugfix, run one agent in each, and diff the approaches."
        level: 2
      - text: "Write a worktree setup step that gives each agent its own dev server port and a separate database."
        level: 3
      - text: "Open a terminal tab per task and start an agent in each, all working in the one shared checkout."
        level: 1
      - text: "Run all three tasks in one agent session on the same branch and check its progress on each in turn."
        level: 0
      - text: "Clone the repo again into two sibling folders and run one agent in each of the three clones."
        level: 1
  - id: parallel-agents-2
    skill_id: parallel-agents
    situation: >-
      Three parallel agent sessions are running. Two of them have started editing the same configuration file,
      and a third is waiting for input you did not notice.
    options:
      - text: "Assign each session an owned set of files and give the shared config to exactly one of them."
        level: 3
      - text: "Stop two of the sessions and restart them one at a time to avoid collisions on the config file."
        level: 1
      - text: "Use the multiplexer status view to spot stalled sessions and add an alert for any session that goes idle."
        level: 3
      - text: "Compare each worktree diff, resolve the shared file by hand, and enable alerts for blocked sessions."
        level: 2
  - id: spec-driven-workflow-1
    skill_id: spec-driven-workflow
    situation: >-
      You are about to ask a coding agent to build a feature that touches the database, the API and the UI.
      The first attempt last time produced a lot of code that did not match what you had in mind.
    options:
      - text: "Write a short spec with behavior and test cases, have the agent derive a plan, and review both."
        level: 2
      - text: "Describe the feature with its schema and UI mockups in a first prompt and let the agent build it."
        level: 0
      - text: "Encode the spec in failing acceptance tests before the plan and accept each task once the tests pass."
        level: 4
      - text: "Ask the agent for a plan before coding and check it for obvious gaps before approving it in the chat."
        level: 1
      - text: "Break the plan into small database, API and UI tasks with acceptance criteria and a fresh session each."
        level: 3
  - id: spec-driven-workflow-2
    skill_id: spec-driven-workflow
    situation: >-
      Halfway through executing a plan, the agent discovers that a library does not support what the spec
      assumed. Several tasks depend on that assumption.
    options:
      - text: "Add a preflight script to the plan template that checks each library assumption before the run."
        level: 3
      - text: "Let the agent pick a replacement library on its own and keep executing remaining tasks in the plan."
        level: 0
      - text: "Add the new constraint to the spec and revise only dependent tasks after pausing execution."
        level: 2
      - text: "Stop the run and write a small spike test against the library for each other assumption in the spec."
        level: 3
  - id: agent-verification-1
    skill_id: agent-verification
    situation: >-
      The agent says the feature is finished and all tests pass. You are about to merge.
    options:
      - text: "Run the tests, linter and type check on the branch and read the output before merging."
        level: 2
      - text: "Ignore the summary and merge on green exit codes from a CI job the agent cannot touch."
        level: 4
      - text: "Merge once the agent's summary says every test passes and reports no failed checks."
        level: 0
      - text: "Wire a Stop hook that runs the checks and returns any errors to the agent to fix."
        level: 3
      - text: "Confirm that the CI badge on the pull request is green and skim the diff before merging it."
        level: 1
  - id: agent-verification-2
    skill_id: agent-verification
    situation: >-
      You notice the agent made a failing test pass by loosening an assertion and adding a skip. It told
      you everything was green.
    options:
      - text: "Configure a hook that rejects edits to test files during implementation and route test changes to review."
        level: 3
      - text: "Revert the agent's commit and rerun the same task prompt until the suite comes back green."
        level: 0
      - text: "Base merges on a protected copy of the acceptance tests kept outside the agent's write access."
        level: 4
      - text: "Add a CI check that fails when skipped tests or assertion counts change against the base branch."
        level: 3
      - text: "Restore the test and add a line to the agent instructions forbidding weakened or skipped tests."
        level: 1
      - text: "Review test diffs separately from code diffs before each merge and reject any weakened assertion."
        level: 2
  - id: tool-use-loop-1
    skill_id: tool-use-loop
    situation: >-
      You need a small assistant that can call two of your own functions. You are asked not to add an agent
      framework, so you call the model API directly.
    options:
      - text: "Record real model API responses once and replay them through the loop to check each change."
        level: 3
      - text: "Write a prompt telling the model to reply with a JSON function name and arguments, parsed by a regex."
        level: 0
      - text: "Write the loop with a maximum turn count and handle several tool calls in one response."
        level: 2
      - text: "Check the arguments against each function schema and return the errors to the model in tool results."
        level: 3
      - text: "Implement the loop from the docs example, sending tool definitions and returning each function result."
        level: 1
  - id: tool-use-loop-2
    skill_id: tool-use-loop
    situation: >-
      Your hand-written loop sometimes fails with an error because the next request contains a tool result
      that does not match the tool call the model made.
    options:
      - text: "Print the message list before each request and compare tool call ids with result ids."
        level: 2
      - text: "Retry the request on failure and log the raw message list when it fails a second time."
        level: 1
      - text: "Add a check before the request that inserts an error result for each tool call with no result yet."
        level: 3
      - text: "Return exactly one result per tool call id in the next message, including a result when the tool throws."
        level: 2
  - id: agent-sdk-1
    skill_id: agent-sdk
    situation: >-
      You need an agent that reads files, runs commands and keeps its conversation between runs, and you
      would rather not write the tool loop yourself.
    options:
      - text: "Resume the session by id on each run and deny commands outside the folder in a permission callback."
        level: 3
      - text: "Set up the SDK from its quick-start example and swap in the project prompt and folder."
        level: 1
      - text: "Build the agent in a no-code pipeline tool with a separate node for reading files and one for the shell."
        level: 0
      - text: "Save the session id on disk for each project and compact the history when it grows too long."
        level: 3
      - text: "Build the agent with the SDK, restrict the allowed tools, and resume sessions by id on later runs."
        level: 2
  - id: agent-sdk-2
    skill_id: agent-sdk
    situation: >-
      Your SDK agent works on your machine, but when you deploy it as a service it should handle several
      users' tasks at once without them seeing each other's files.
    options:
      - text: "Give each user a separate working directory on the same server and a scoped API token."
        level: 2
      - text: "Run each task in a throwaway sandbox that gets user files from a tool checking the user id."
        level: 4
      - text: "Deploy the hosting example from the SDK docs in one container, with all tasks sharing its working directory."
        level: 1
      - text: "Give each session its own container with a private file system and delete it when the run ends."
        level: 3
  - id: mcp-server-build-1
    skill_id: mcp-server-build
    situation: >-
      Your team wants coding agents to query your internal deployment service. There is no ready-made MCP
      server for it.
    options:
      - text: "Shape the tools around tasks agents perform instead of mirroring every endpoint of the API."
        level: 3
      - text: "Generate a server from the OpenAPI spec with a template generator and keep its default tools."
        level: 1
      - text: "Write a shell script that wraps curl calls to the deployment API and let the agent run it."
        level: 0
      - text: "Serve the server over HTTP with auth, input validation, and error messages the model can act on."
        level: 3
      - text: "Build a small server with the official SDK exposing a few described tools over stdio, then test it."
        level: 2
  - id: mcp-server-build-2
    skill_id: mcp-server-build
    situation: >-
      Your MCP server works locally over stdio. Now remote teammates need it, and some of its tools
      must only be available to certain people.
    options:
      - text: "Serve it over HTTP with OAuth and derive the tool list and per-call checks from IdP groups."
        level: 4
      - text: "Switch to the HTTP transport and give each teammate an API key listed in a JSON file on the server."
        level: 2
      - text: "Share the repo and have each teammate run a local server with their own credentials."
        level: 1
      - text: "Serve it over HTTP with OAuth and check the caller's role inside each sensitive tool before it runs."
        level: 3
  - id: multi-agent-orchestration-1
    skill_id: multi-agent-orchestration
    situation: >-
      You are building a system that researches a topic, drafts a report and checks the draft's claims. One
      big prompt gives shallow, error-prone results.
    options:
      - text: "Build an orchestrator that fans research out to parallel workers, then runs a drafting agent."
        level: 2
      - text: "Switch the single prompt to a larger model with a longer context window and raise the token limit."
        level: 0
      - text: "Show the reviewing agent only the draft and its sources, and send failed claims back to research."
        level: 4
      - text: "Chain research, draft and check prompts manually, pasting each output into the next prompt in a shared doc."
        level: 1
      - text: "Wire a research step, a draft step and a checker together in code with fixed handoffs between them."
        level: 2
  - id: multi-agent-orchestration-2
    skill_id: multi-agent-orchestration
    situation: >-
      In your multi-agent pipeline, one worker sometimes returns confident but wrong output, and the next agent
      builds on it. By the end the final answer is wrong and hard to trace.
    options:
      - text: "Make each worker attach the source passages for its claims and have the next agent reject unsupported ones."
        level: 3
      - text: "Log each agent's input and output in JSON and trace back to the first step that failed."
        level: 2
      - text: "Repeat the pipeline run in a clean environment with a test input and compare the new answer with the old one."
        level: 1
      - text: "Run an independent verifier agent after the risky worker to check its claims against the sources."
        level: 3
  - id: human-in-the-loop-1
    skill_id: human-in-the-loop
    situation: >-
      Your app lets an agent send emails and delete records for users. Leadership wants a person to confirm
      anything that cannot be undone.
    options:
      - text: "Mark irreversible actions and resume the run only after a confirmation dialog on each of them."
        level: 2
      - text: "Put every tool call through the app's permission function, returning allow, ask or deny per user."
        level: 4
      - text: "Turn on the mail provider's undo-send delay and keep nightly backups to restore deleted records."
        level: 0
      - text: "Add a rule to the system prompt requiring the model to ask the user before any irreversible action."
        level: 1
      - text: "Enforce approval inside the tool code, save pending approvals in the database, and wait until resolved."
        level: 3
  - id: human-in-the-loop-2
    skill_id: human-in-the-loop
    situation: >-
      A user starts a long-running agent task in your app, then notices it is heading the wrong way and wants
      to stop it right away.
    options:
      - text: "Check a cancel flag in the loop between steps, and report the steps the run already completed."
        level: 2
      - text: "Kill the whole worker container from an admin page when a user reports that a run went the wrong way."
        level: 0
      - text: "Abort the in-flight request and tools when the user hits stop, and flag partial changes for review."
        level: 3
      - text: "Add a stop button that closes the connection to the model and ends the run immediately."
        level: 1
  - id: workflow-automation-1
    skill_id: workflow-automation
    situation: >-
      Every day someone copies new support emails into a spreadsheet and tags them by topic. You are asked
      to automate it with a tool that has language model steps.
    options:
      - text: "Send the low-confidence topic tags to a person for review and keep the tagging prompt in a variable."
        level: 3
      - text: "Start from a gallery template in the tool and connect the mail and spreadsheet accounts."
        level: 1
      - text: "Have one model step read the whole inbox each night and rewrite all of the spreadsheet from scratch."
        level: 0
      - text: "Test the workflow on a copy of the sheet with sample support emails and an alerting error branch."
        level: 3
      - text: "Set up the workflow with a new-mail trigger, a model prompt that tags the topic, and an append-row step."
        level: 2
  - id: workflow-automation-2
    skill_id: workflow-automation
    situation: >-
      An automation you built occasionally sends a customer the wrong template, because the model step sometimes
      returns text in a format the next node does not expect.
    options:
      - text: "Have the model step return an id from a fixed list and look up the template for it in code."
        level: 4
      - text: "Add a validation step that parses the output and routes any of the failures to a manual review queue."
        level: 2
      - text: "Tighten the prompt to require a strict output schema and include an example of the exact format."
        level: 1
      - text: "Add a structured output schema to the model step and a check on the template name before sending."
        level: 3
  - id: ai-sdk-1
    skill_id: ai-sdk
    situation: >-
      Your TypeScript app calls one model vendor through that vendor's own client library. The product team wants to
      send some requests to a second vendor without rewriting every call site.
    options:
      - text: "Adapt the provider example from the SDK docs and read the provider and model for each feature from config."
        level: 2
      - text: "Add the second vendor's client next to the first and route a few call sites to it with an env flag check."
        level: 0
      - text: "Set up a provider registry with the named aliases and have each call site ask for the alias it needs."
        level: 3
      - text: "Install the second provider package and change the model string at each call site that should move."
        level: 1
      - text: "Replace the vendor client with the SDK core functions and pass the model in from one shared module."
        level: 2
  - id: ai-sdk-2
    skill_id: ai-sdk
    situation: >-
      A support chat built on the SDK gives the model a tool that looks up an order. The model calls the tool, but
      the reply ends right there instead of an answer that uses the order details.
    options:
      - text: "Copy the weather tool example from the SDK docs and swap in the order lookup with its own zod input schema."
        level: 1
      - text: "Write a prepareStep function that drops the order tool after the first call and forces a text answer next."
        level: 3
      - text: "Fetch the order before the call and paste the order JSON into the system prompt that each turn sends."
        level: 0
      - text: "Adapt the multi-step example from the docs and set a stop condition that lets the model answer after the tool."
        level: 2
  - id: streaming-ui-1
    skill_id: streaming-ui
    situation: >-
      Your React chat page sends a question and shows nothing for ten seconds, then the whole answer appears at
      once. Users assume the page has frozen and reload it.
    options:
      - text: "Buffer the incoming chunks and flush them to the state once per animation frame to keep long replies smooth."
        level: 3
      - text: "Render the message parts from the chat hook quick-start on the page and keep the hook's default transport."
        level: 1
      - text: "Stream the reply over server-sent events with ids and resume from the last id after the page reloads."
        level: 4
      - text: "Show a spinner over the chat that covers the input until the full answer returns from the API route."
        level: 0
      - text: "Return a text stream from the API route and append each chunk to the message state while it arrives."
        level: 2
  - id: streaming-ui-2
    skill_id: streaming-ui
    situation: >-
      Streamed answers in your chat look fine, but long replies make the page stutter, and when a user leaves the
      page the server keeps generating tokens that nobody reads.
    options:
      - text: "Pass the request abort signal to the model call and abort the fetch in the chat hook's cleanup on unmount."
        level: 2
      - text: "Cap the max output tokens on each request to keep every streamed reply short enough to render quickly."
        level: 0
      - text: "Set the throttle option from the chat hook docs for long replies and memoize the old messages."
        level: 3
      - text: "Add the stop button from the chat hook example and wire it to the stop function that the hook returns."
        level: 1
      - text: "Render the reply in plain text while it streams and switch to the markdown renderer once it ends."
        level: 2
  - id: generative-ui-1
    skill_id: generative-ui
    situation: >-
      Your assistant should show a flight card with a booking button when the user asks about flights, instead of a
      paragraph of text that describes the options.
    options:
      - text: "Render the flight tool result in a generic card from the UI library with its default booking button."
        level: 1
      - text: "Have the model pick a flight card id from a fixed registry and validate the props before the render."
        level: 4
      - text: "Ask the model to reply in markdown tables and add a CSS rule that styles each table like a flight card."
        level: 0
      - text: "Adapt the weather card example from the docs into a flight tool with a schema and a FlightCard component."
        level: 2
  - id: generative-ui-2
    skill_id: generative-ui
    situation: >-
      Your generated UI sometimes shows a booking form with fields the model made up, and one card rendered a link
      to a domain your company does not own.
    options:
      - text: "Check every URL in the tool arguments against an allowlist of domains in the renderer before a link shows."
        level: 3
      - text: "Remove the booking form from the generated UI and hide the links in the cards until the next release."
        level: 0
      - text: "Resolve the ids the model returns into links and form fields on the server and send the finished props."
        level: 4
      - text: "Fix the form fields in the component code and take the prefilled values from the tool call arguments."
        level: 2
      - text: "Add a line to the system prompt that tells the model to use only the real form fields and company links."
        level: 1
  - id: structured-output-1
    skill_id: structured-output
    situation: >-
      Your app asks the model for an invoice summary in JSON, then parses it. About one reply in fifty breaks the
      parser or has a missing field.
    options:
      - text: "Validate with the zod schema and send the validation errors back to the model for one repair attempt."
        level: 3
      - text: "Add a JSON example of the invoice schema to the prompt and tell the model to reply with exactly that shape."
        level: 1
      - text: "Turn on the provider's strict schema mode to constrain decoding and keep the zod check on each invoice."
        level: 4
      - text: "Wrap the parse in a try block and rerun the same request until the reply parses without an error."
        level: 0
      - text: "Define a zod schema for the invoice and pass it to the SDK object generation call to get typed data."
        level: 2
  - id: structured-output-2
    skill_id: structured-output
    situation: >-
      The invoice schema gained two new fields last week. Older stored results now fail to load, and the prompt
      still describes the old shape.
    options:
      - text: "Generate the field list of the prompt and the JSON shape from the one zod definition with describe calls."
        level: 3
      - text: "Mark the new fields optional with defaults in the zod schema and parse old rows through the same schema."
        level: 2
      - text: "Edit the field list in the prompt by hand to match the new zod schema and reload the failing results."
        level: 1
      - text: "Version the schema and write a migration that upgrades the stored rows to the new shape at load time."
        level: 3
  - id: evals-1
    skill_id: evals
    situation: >-
      You changed the system prompt of a summarization feature, and it reads better on the three examples you tried.
      You are about to ship it.
    options:
      - text: "Run both prompts over a saved set of fifty real inputs and compare the outputs side by side before merging."
        level: 2
      - text: "Add the saved set and the judge to CI and fail a merge when a system prompt change lowers the score."
        level: 4
      - text: "Ship the new prompt once the unit tests pass in CI and read the support tickets over the week for complaints."
        level: 0
      - text: "Score both prompts over the saved set with the judge template from the docs, rewritten for this product."
        level: 3
      - text: "Add the eval script from the framework docs to CI and check the same three examples for both prompts."
        level: 1
  - id: evals-2
    skill_id: evals
    situation: >-
      Your LLM-as-judge eval says the new model is better, but a colleague who read the outputs disagrees on several
      of the cases.
    options:
      - text: "Switch the judge to pairwise comparison with swapped order and require a clear win in both orders."
        level: 3
      - text: "Trust the judge score over the colleague and ship the new model once the eval script passes in CI."
        level: 0
      - text: "Label a sample by hand with the colleague and trust the judge once it agrees with those labels."
        level: 4
      - text: "Read the cases where the colleague disagrees and rerun the judge with a rubric that covers them."
        level: 2
      - text: "Swap the judge for a larger model with the judge prompt from the framework docs and run the eval again."
        level: 1
  - id: llm-observability-1
    skill_id: llm-observability
    situation: >-
      Users report that the assistant sometimes takes thirty seconds to answer. Your logs show the request and the
      final reply, but nothing in between.
    options:
      - text: "Install the tracing SDK from the vendor quick-start and keep its auto-instrumentation settings unchanged."
        level: 1
      - text: "Carry one trace id from each request through every service and the model gateway into a single trace."
        level: 4
      - text: "Wrap each model call and tool call in a span with tokens and latency under one trace per request."
        level: 2
      - text: "Add timing logs to the request handler that print the total time, and read them after the next complaint."
        level: 0
      - text: "Extend the default instrumentation with spans for the tool calls and tag each trace with the user."
        level: 3
  - id: llm-observability-2
    skill_id: llm-observability
    situation: >-
      Your traces now contain full prompts and responses, and the security team points out that some of them include
      customer email addresses and card numbers.
    options:
      - text: "Hash the user ids in trace metadata and mask the app's own sensitive fields with a custom function."
        level: 3
      - text: "Enable the masking option in the tracing client settings and keep the patterns it ships with."
        level: 1
      - text: "Run the redaction in the trace collector outside the app and drop raw payloads before storage."
        level: 4
      - text: "Extend the default masking patterns from the vendor docs with the email and card formats of the app."
        level: 2
  - id: prompt-injection-1
    skill_id: prompt-injection
    situation: >-
      Your support agent reads incoming emails and can issue refunds through a tool. A tester got it to refund an
      order by hiding instructions inside an email.
    options:
      - text: "Require a human approval step in the app for every refund the agent proposes from an email thread."
        level: 2
      - text: "Filter emails that contain phrases like ignore previous instructions with a regex before the agent."
        level: 0
      - text: "Have a separate model call turn each email into a typed request and give the agent that request."
        level: 3
      - text: "Add a line to the system prompt telling the model to treat instructions in emails like plain data."
        level: 1
      - text: "Check each refund in the tool code against the order's owner and the sender's verified address."
        level: 4
  - id: prompt-injection-2
    skill_id: prompt-injection
    situation: >-
      You are adding a web browsing tool to an internal agent that can also read your company wiki and post messages
      to chat channels.
    options:
      - text: "Restrict the browsing tool to an allowlist of domains in its config and log every URL it fetches."
        level: 3
      - text: "Disable the chat posting tool in the tool router for any agent session that has fetched a web page."
        level: 4
      - text: "Ask for user approval before each chat post and each browse call once wiki content is in context."
        level: 2
      - text: "Add the browsing tool to the agent and test that it refuses to post wiki text on a few sample pages."
        level: 0
  - id: cost-caching-1
    skill_id: cost-caching
    situation: >-
      Your monthly model bill doubled. Most requests send the same long system prompt and a large product catalog,
      followed by a short user question.
    options:
      - text: "Turn on prompt caching with the setting from the provider docs and keep the prompt order unchanged."
        level: 1
      - text: "Compare the cache read and write tokens per request and alert when the hit rate falls below a target."
        level: 3
      - text: "Switch every request to the smallest model and cap the catalog at the first hundred products."
        level: 0
      - text: "Follow the caching docs to move the system prompt and catalog first and mark that prefix for caching."
        level: 2
      - text: "Send the catalog entries that match the question from a search step and cache the fixed prompt."
        level: 3
  - id: cost-caching-2
    skill_id: cost-caching
    situation: >-
      Finance asks you to keep the LLM spend of an internal tool under a fixed monthly amount, and one team's batch
      script has already used half of it in a week.
    options:
      - text: "Move the batch script to the provider batch API at the lower price and give it its own API key."
        level: 2
      - text: "Email the team that runs the batch script and ask them to run it less often until next month."
        level: 0
      - text: "Issue the team keys from a gateway that counts the spend and rejects calls once a team's budget runs out."
        level: 4
      - text: "Set a spend limit in the provider console with an email alert that fires at the monthly amount."
        level: 1
      - text: "Write a usage report that sums the tokens per API key each day and posts totals to the team channel."
        level: 3
  - id: model-selection-1
    skill_id: model-selection
    situation: >-
      Your feature uses the largest model for every request, including short classification calls that pick one of
      five labels.
    options:
      - text: "Keep the largest model for every call and cap the prompt length that each classification call sends."
        level: 0
      - text: "Compare three models on a labelled set of past classification calls and pick the cheapest that fits."
        level: 3
      - text: "Switch all calls to the newest mid-size model in the provider lineup and keep the prompts unchanged."
        level: 1
      - text: "Route each request by a small model's confidence and escalate the unsure cases to the large model."
        level: 4
      - text: "Move the classification calls to the small model the docs suggest for labels and keep the large one."
        level: 2
  - id: model-selection-2
    skill_id: model-selection
    situation: >-
      An agent that plans multi-file refactors gives shallow plans on hard tasks, but raising the effort level on
      every call made the simple tasks slow.
    options:
      - text: "Raise the effort for the planning step alone and cap the effort for the edit steps at the default."
        level: 2
      - text: "Rerun the hard tasks a few times with the same settings and keep only the plan that looks most thorough."
        level: 0
      - text: "Pick the effort for each task from the number of files the plan touches, with the thresholds in config."
        level: 3
      - text: "Set the effort to the level the docs recommend for coding agents and keep it for all tasks."
        level: 1
      - text: "Measure the plan quality at each effort level on past refactors and route the tasks by those scores."
        level: 3
  - id: embeddings-1
    skill_id: embeddings
    situation: >-
      You want users to find help articles by meaning, beyond exact keyword matches. There are about two thousand
      articles.
    options:
      - text: "Chunk the articles by heading, embed the chunks and store them with the article id in a vector index."
        level: 2
      - text: "Add synonyms for common terms to the keyword index with a script that expands each query."
        level: 0
      - text: "Use one hybrid ranking over keyword and vector scores and tune the weight on a set of real queries."
        level: 3
      - text: "Index each article with the embedding model from the vector database quick-start and return the top five."
        level: 1
      - text: "Build a labelled query set from search logs and pick the embedding model and chunk size by recall."
        level: 3
  - id: embeddings-2
    skill_id: embeddings
    situation: >-
      Your similarity search worked well for months. After you switched to a newer embedding model for new
      documents, results for the old documents became poor.
    options:
      - text: "Encode each query with both models during the switch and search each model's vectors with its own query."
        level: 3
      - text: "Lower the similarity threshold in the search config to the default that the vector store docs list."
        level: 1
      - text: "Build the new index under a versioned name and move the read alias to it after a recall test passes."
        level: 4
      - text: "Raise the result count per query and check that the reranker puts the old documents back on top."
        level: 0
      - text: "Rerun the embedding job over every old document with the new model and swap the index once it finishes."
        level: 2
  - id: rag-1
    skill_id: rag
    situation: >-
      Your RAG assistant answers questions about internal policies, but it often cites the right document and still
      gets the details wrong.
    options:
      - text: "Raise the top-k setting in the retrieval config and send more chunks to the model with each question."
        level: 1
      - text: "Add a reranker over the retrieved chunks and keep a set of failing questions to rerun after each change."
        level: 3
      - text: "Switch to a model with a larger context window and send the whole policy folder with every question."
        level: 0
      - text: "Score the retrieval and the answers apart on labelled questions and keep the index changes that raise both."
        level: 4
      - text: "Inspect the retrieved chunks for failing questions and fix the chunk size where details got split apart."
        level: 2
  - id: rag-2
    skill_id: rag
    situation: >-
      Your RAG assistant indexes documents from several teams. A user just got an answer quoting a document from a
      team space they have no access to.
    options:
      - text: "Look up each retrieved document in the permission API of the team space at query time before the model."
        level: 4
      - text: "Store the team space id with each chunk and filter the retrieval query by the spaces of the current user."
        level: 2
      - text: "Sync the access lists from the wiki into the index metadata each hour and filter retrieval on them."
        level: 3
      - text: "Add a line to the system prompt telling the model to skip documents the user is not allowed to read."
        level: 1
  - id: team-adoption-1
    skill_id: team-adoption
    situation: >-
      You set up coding agent licenses for your team of eight two months ago. Usage logs show two people use it
      daily and the rest stopped after the first week.
    options:
      - text: "Share the vendor's getting-started guide in the team channel and set a date to check usage again."
        level: 1
      - text: "Ship the agent preinstalled in the team dev container with the repo commands ready on first launch."
        level: 4
      - text: "Pair with each person on one real ticket from their own backlog using the agent and note the blockers."
        level: 2
      - text: "Commit a project CLAUDE.md and custom commands built from the docs examples for the team's common tasks."
        level: 3
  - id: team-adoption-2
    skill_id: team-adoption
    situation: >-
      Half of your team now uses the coding agent daily. The other half says it produces code they have to rewrite,
      and avoids it.
    options:
      - text: "Collect three concrete cases of rewritten code from the skeptics and fix the prompts or context behind them."
        level: 2
      - text: "Leave the tool optional and let each person decide on their own whether it is worth the time."
        level: 0
      - text: "Review the rewrite rate of PRs labelled agent-written and go through the worst cases with authors."
        level: 3
      - text: "Forward the vendor's best-practices article to the skeptics and suggest a second try on a small ticket."
        level: 1
  - id: shared-config-standards-1
    skill_id: shared-config-standards
    situation: >-
      Each of your team's twelve repos has its own copy of the agent instructions file, and the copies have drifted:
      some forbid things others require.
    options:
      - text: "Write a script that diffs each repo's file against the shared base and opens a PR for any drift."
        level: 3
      - text: "Copy the most complete file into every repo and ask the owners to keep it in sync with that one."
        level: 1
      - text: "Generate the file in each repo from the central source on every merge and overwrite direct edits."
        level: 4
      - text: "Move the shared rules into one central file that the docs show how to import, with a local file per repo."
        level: 2
      - text: "Merge every repo's rules into one long file and paste it into each repo by hand once a quarter."
        level: 0
  - id: shared-config-standards-2
    skill_id: shared-config-standards
    situation: >-
      Your team agreed on lint and formatting rules for AI-written code, but agents in different repos follow
      different style rules from old settings files.
    options:
      - text: "Fix the style problems in review comments and hold the merge until the authors correct them."
        level: 0
      - text: "Publish one shared lint and formatter config package and require the same version in every repo."
        level: 2
      - text: "Make the shared lint job a required merge status in every repo and drop the local overrides."
        level: 4
      - text: "Add a hook to the shared agent settings that runs the shared formatter after each file edit."
        level: 3
  - id: ai-teaching-1
    skill_id: ai-teaching
    situation: >-
      You are asked to run a two-hour workshop on working with coding agents for twenty developers with mixed
      experience.
    options:
      - text: "Plan exercises on a copy of the team repo where people fix a real bug with the agent in pairs."
        level: 2
      - text: "Demo a few impressive prompts on stage and point people to the docs for the rest of the setup."
        level: 0
      - text: "Prepare a starter branch with a CLAUDE.md for the coding agents and a known bug for each exercise."
        level: 3
      - text: "Walk through the vendor tutorial live on a sample app and share the slides and the code afterwards."
        level: 1
  - id: ai-teaching-2
    skill_id: ai-teaching
    situation: >-
      Two weeks after your workshop, most participants still use the agent for small inline edits and none of the
      techniques you taught.
    options:
      - text: "Schedule a repeat of the same workshop for the people who missed parts of it the first time."
        level: 1
      - text: "Write a short exercise per technique in the team repo, each checked by a test the person runs."
        level: 3
      - text: "Send the workshop slides again with a note asking everyone to review the advanced sections."
        level: 0
      - text: "Ask each participant for one session log a week and annotate the log with the missed techniques."
        level: 4
      - text: "Run short follow-up sessions where each person brings a current ticket and applies one technique."
        level: 2
  - id: codebase-agents-1
    skill_id: codebase-agents
    situation: >-
      New developers keep asking the same questions about how your services fit together. You want a team agent that
      answers from the codebase documentation.
    options:
      - text: "Add a tool that reads code files on demand and a nightly job that re-indexes the docs from main."
        level: 3
      - text: "Collect the common questions and answers into a FAQ page that the team channel pins."
        level: 0
      - text: "Index the docs folder and READMEs into a retrieval tool and have the agent cite the file for each answer."
        level: 2
      - text: "Upload the docs folder to a chat assistant project and share the project link with the team."
        level: 1
      - text: "Regenerate the service map from the code on every merge and index the result next to the written docs."
        level: 4
  - id: codebase-agents-2
    skill_id: codebase-agents
    situation: >-
      Your team's documentation agent confidently answered that a service uses REST, but the service moved to gRPC
      three months ago and the docs were never updated.
    options:
      - text: "Show the last-modified date of each cited doc in the answer and flag pages older than six months."
        level: 2
      - text: "Add a merge rule that needs a docs page update in the same PR whenever a service's proto or route files change."
        level: 4
      - text: "Add a system prompt line telling the agent to say when it is unsure about a service's protocol."
        level: 1
      - text: "Fix the outdated page in the docs and ask the team to check the agent's answers against the code."
        level: 0
  - id: ai-code-governance-1
    skill_id: ai-code-governance
    situation: >-
      Leadership asks for a policy on AI-written code after an agent-generated change shipped a hard-coded API key.
    options:
      - text: "Adopt a published AI usage policy template and add a checklist item for secrets to it."
        level: 1
      - text: "Add a pre-commit hook in the repo template that scans for secrets before any commit lands."
        level: 3
      - text: "Turn on push protection for API keys on the git host and make the scan job a merge gate."
        level: 4
      - text: "Require a human review on every PR with agent-written code and turn on the secret scanning."
        level: 2
  - id: ai-code-governance-2
    skill_id: ai-code-governance
    situation: >-
      Your policy says AI-assisted PRs need a second reviewer, but nobody can tell which PRs were AI-assisted, and
      the rule is not applied.
    options:
      - text: "Label AI-assisted PRs from the template checkbox and have a bot request a second reviewer on them."
        level: 2
      - text: "Remind reviewers in the team channel to look for AI-written code during each review they do."
        level: 0
      - text: "Sign the agent's commits with a dedicated key in its tooling and route those to a second reviewer."
        level: 4
      - text: "Add a checkbox for AI assistance to the PR template and ask authors to tick it when it applies."
        level: 1
      - text: "Add the agent's co-author trailer to its settings and a CI job that requires two approvals when it appears."
        level: 3
