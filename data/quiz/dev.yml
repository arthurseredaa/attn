# DRAFT quiz bank: drafted by Claude (2026-10-14), NOT reviewed by the project owner.
# The owner must review every question and every option level before this bank is trusted:
# check that the situation is realistic, that each option's hidden level (0-4, the shared level scale)
# matches what the option shows about the person, and that wrong-sounding options are not obviously wrong.
# Once reviewed, remove this header. Levels are hidden: they never leave the server.
version: 1
questions:
  - id: context-engineering-1
    skill_id: context-engineering
    situation: >-
      You start using a coding agent on an existing repo, and it keeps running the wrong test command and
      ignoring your folder conventions. You want it to get these right from the first message of every session.
    options:
      - text: "Write a root CLAUDE.md with the exact test command and folder conventions, and prune it each month."
        level: 2
      - text: "Keep folder rules in nested CLAUDE.md files and derive the root test command from the package manifest on commit."
        level: 4
      - text: "Add the test script name and folder rules to the first prompt of every new session in the repo."
        level: 0
      - text: "Split rules into a root CLAUDE.md plus nested files per package, and try each in a fresh session."
        level: 3
      - text: "Run the init command to generate a CLAUDE.md and commit the generated file with minimal edits."
        level: 1
  - id: context-engineering-2
    skill_id: context-engineering
    situation: >-
      Two hours into a long session the agent starts forgetting decisions made earlier and repeats mistakes
      you already corrected. The context window is nearly full.
    options:
      - text: "Ask the agent to save decisions to a notes file, then start a fresh session that reads it first."
        level: 2
      - text: "Keep working in the same session and restate each decision in the prompt whenever the agent drifts."
        level: 0
      - text: "Add a decisions log to CLAUDE.md that the agent appends to and rereads at each session start."
        level: 3
      - text: "Run compact with a note listing what must survive, then continue in the same session."
        level: 2
  - id: cc-skills-commands-1
    skill_id: cc-skills-commands
    situation: >-
      You paste the same long prompt for reviewing pull requests several times a week. A colleague says
      this should be saved somewhere reusable instead of living in your notes.
    options:
      - text: "Turn the prompt into a skill with a rubric file and a helper command that fetches the PR diff."
        level: 3
      - text: "Save the prompt in a shell script that prints it, and paste the output into a clean chat for each review."
        level: 0
      - text: "Turn the prompt into a slash command file with a PR number argument and check it into the repo."
        level: 2
      - text: "Install a published review command from a plugin repo and run it with its default settings."
        level: 1
      - text: "Give the review command front matter that restricts its tools to read-only git and gh calls."
        level: 3
  - id: cc-skills-commands-2
    skill_id: cc-skills-commands
    situation: >-
      A skill you wrote is never picked up by the agent, even when you ask for exactly the task it was
      written for. Other skills in the same folder load fine.
    options:
      - text: "Rerun a fixed set of example task prompts headless and record the skill each one actually loads."
        level: 4
      - text: "Compare the skill front matter with the example in the docs and fix any field that fails to match."
        level: 1
      - text: "Rename the skill folder to match the task wording and test again with the same prompt."
        level: 0
      - text: "Reword the skill description to state when it applies, then retry a few phrasings of the task."
        level: 2
  - id: cc-hooks-1
    skill_id: cc-hooks
    situation: >-
      Your team keeps committing code that skips the formatter because the coding agent edits files
      directly. You want formatting to happen every time without relying on the agent remembering.
    options:
      - text: "Have the PostToolUse hook return formatter errors to the agent and require a fix before it finishes."
        level: 3
      - text: "Copy the documented PostToolUse formatter example into settings.json and keep its default matcher."
        level: 1
      - text: "Move formatting into a git pre-commit step that runs no matter what tool made the edit."
        level: 4
      - text: "Run the formatter manually before each commit and check the diff for files it changed."
        level: 0
      - text: "Add a PostToolUse hook that formats the edited file, with the command changed to the team formatter."
        level: 2
  - id: cc-hooks-2
    skill_id: cc-hooks
    situation: >-
      The agent must never run destructive shell commands such as forced pushes or deleting outside the
      project, even when it is running unattended and nobody can approve prompts.
    options:
      - text: "Register a PreToolUse hook on the shell tool that matches risky commands and blocks them with a message."
        level: 3
      - text: "Skip the permission prompts for the run and check the git reflog for forced pushes afterwards."
        level: 0
      - text: "Run the agent in a container whose sole mount is a writable worktree, with no push credentials."
        level: 4
      - text: "List deny rules in the project settings for git force push and rm outside the project directory."
        level: 2
      - text: "Add a line to the agent instructions forbidding force push and deletes outside the project."
        level: 1
  - id: cc-subagents-1
    skill_id: cc-subagents
    situation: >-
      You ask the agent to find every place a deprecated function is used across a big monorepo. The main
      conversation fills up with search output before it can start the actual migration.
    options:
      - text: "Make a search subagent return JSON call sites, then hand each file to a migration subagent."
        level: 4
      - text: "Ask the agent to run the search in a subagent that returns only file paths and line numbers."
        level: 2
      - text: "Write a grep script that prints every match into the main conversation, then check each hit."
        level: 0
      - text: "Define a search agent file with read-only tools and a short output format, then reuse it across repos."
        level: 3
      - text: "Clear the conversation and rerun the search with a narrower grep pattern and a smaller directory scope."
        level: 1
  - id: cc-subagents-2
    skill_id: cc-subagents
    situation: >-
      A custom agent you defined keeps wandering outside its job: it edits files when it should only review,
      and its summaries come back too long to be useful.
    options:
      - text: "Write a SubagentStop hook that sends summaries over a word count back to the agent for a rewrite."
        level: 3
      - text: "Add a line to the agent prompt that says review only and keep every summary under ten lines."
        level: 1
      - text: "Remove the edit tools from the agent file's tool list and cap the summary length in its prompt."
        level: 2
      - text: "Split it into a reviewer agent with read tools and a fixer agent, each with a different tool list."
        level: 3
  - id: cc-plugins-1
    skill_id: cc-plugins
    situation: >-
      You have a few skills, a hook and a custom agent that work well on your machine. Three colleagues
      want the same setup and you do not want to send them files to copy by hand.
    options:
      - text: "Publish a team marketplace that lists the plugin, with a pinned version for each release."
        level: 3
      - text: "Write a setup script that copies the files into each colleague's .claude folder and email it."
        level: 0
      - text: "Derive the plugin and its marketplace entry from the repo folders on every tagged release."
        level: 4
      - text: "Bundle the skills, hook and agent into a plugin with a manifest and install it from the repo."
        level: 2
  - id: cc-plugins-2
    skill_id: cc-plugins
    situation: >-
      A plugin you ship to the team updated its hook last week and now some colleagues report broken
      sessions while others see nothing wrong.
    options:
      - text: "Hold each version until a CI job that installs it into clean profiles passes on every OS the team uses."
        level: 4
      - text: "Ask affected colleagues to delete the plugin folder, reinstall it and rerun the failing hook."
        level: 0
      - text: "Compare the plugin version per colleague config and roll back the hook for the broken ones."
        level: 2
      - text: "Follow the update steps in the install docs and check the hook version that each session log shows."
        level: 1
      - text: "Pin the marketplace entry to tagged releases and keep a changelog that supports rollbacks."
        level: 3
  - id: cc-mcp-usage-1
    skill_id: cc-mcp-usage
    situation: >-
      You want the coding agent to read issues from your tracker and look at the production database schema
      without you copying text into the chat.
    options:
      - text: "Point the database server at a read replica with a least-privilege user and disable its write tools."
        level: 3
      - text: "Copy the issue text and the table schema into the chat window for each task, one query at a time."
        level: 0
      - text: "Connect both servers in a shared .mcp.json file and keep each credential in its own environment variable."
        level: 2
      - text: "Set per-tool permission rules that allow tracker reads and require approval for each database query."
        level: 3
      - text: "Add the tracker server with the command from its README and sign in when the browser prompts."
        level: 1
  - id: cc-mcp-usage-2
    skill_id: cc-mcp-usage
    situation: >-
      After connecting five MCP servers, the agent is slower, picks the wrong tools, and your context fills up
      before you have typed anything.
    options:
      - text: "Move most servers into per-project config files, loading only the ones each repo uses."
        level: 2
      - text: "Front the servers with one small proxy server that exposes a few curated tools and forwards calls."
        level: 4
      - text: "Follow the troubleshooting page for each server and check the entries that start slowly."
        level: 1
      - text: "Measure the tokens each server tool list adds and replace the heaviest ones within a set budget."
        level: 3
      - text: "Disable rarely used servers in settings and keep the two or three needed for the current task."
        level: 2
  - id: cc-headless-ci-1
    skill_id: cc-headless-ci
    situation: >-
      You want the agent to summarize failing tests in a short comment on every pull request, with no one
      sitting at a terminal.
    options:
      - text: "Run it read-only with JSON output and a turn limit, and post the comment only if the result parses."
        level: 3
      - text: "Run the agent by hand on the CI log of each failing pull request and paste its summary into a comment."
        level: 0
      - text: "Give the agent no comment token and let a later job check its JSON file before posting it."
        level: 4
      - text: "Add a CI step that runs claude -p with a short prompt and a limited tool list, then posts the output."
        level: 2
      - text: "Copy the example workflow from the docs, add the API key secret, and limit it to pull request events."
        level: 1
  - id: cc-headless-ci-2
    skill_id: cc-headless-ci
    situation: >-
      You want a nightly job that triages new issues and opens draft pull requests for the easy ones, running
      on a schedule rather than on someone's laptop.
    options:
      - text: "Split triage and edits into two runs with different tokens, giving the triage run read-only access."
        level: 3
      - text: "Copy the scheduled workflow example from the docs and swap in the triage prompt and API key secret."
        level: 1
      - text: "Record each run's outcome and cost in a log, and alert on errors or unusually high spend."
        level: 3
      - text: "Triage new issues manually each morning and check the easy ones before opening draft pull requests."
        level: 0
      - text: "Add a scheduled workflow with a bounded prompt and a cost cap that opens only draft pull requests."
        level: 2
  - id: parallel-agents-1
    skill_id: parallel-agents
    situation: >-
      You want to try two different approaches to the same feature and keep working on a small bugfix at the
      same time, all with coding agents.
    options:
      - text: "Create a git worktree per task, run one session in each, and compare the branches by diff."
        level: 2
      - text: "Write a worktree setup step that gives each copy its own dev server port and database."
        level: 4
      - text: "Open a terminal tab per task and start an agent in each, all sharing one checkout and test database."
        level: 1
      - text: "Finish each task in the same checkout and commit it before starting the next one on that branch."
        level: 0
      - text: "Clone the repo a second time into a sibling folder and run one agent in each clone, one per task."
        level: 1
  - id: parallel-agents-2
    skill_id: parallel-agents
    situation: >-
      Three parallel agent sessions are running. Two of them have started editing the same configuration file,
      and a third is waiting for input you did not notice.
    options:
      - text: "Assign each session an owned set of files and give the shared config to exactly one of them."
        level: 3
      - text: "Stop two of the sessions and restart them one at a time to avoid collisions on the config file."
        level: 1
      - text: "Use the multiplexer status view to spot stalled sessions and add an alert for any idle one."
        level: 3
      - text: "Compare each worktree diff, resolve the shared file by hand, and enable alerts for blocked sessions."
        level: 2
  - id: spec-driven-workflow-1
    skill_id: spec-driven-workflow
    situation: >-
      You are about to ask a coding agent to build a feature that touches the database, the API and the UI.
      The first attempt last time produced a lot of code that did not match what you had in mind.
    options:
      - text: "Write a short spec of behavior and constraints, have the agent derive a plan, and review both."
        level: 2
      - text: "Describe the feature in the first prompt and let the agent pick the schema, endpoints and tests."
        level: 0
      - text: "Encode each spec requirement in a failing acceptance test before planning and gate every task on it."
        level: 4
      - text: "Ask the agent for a plan before coding and check it for obvious gaps before approving it in the chat."
        level: 1
      - text: "Break the plan into small tasks with acceptance criteria and run each one in a fresh session."
        level: 3
  - id: spec-driven-workflow-2
    skill_id: spec-driven-workflow
    situation: >-
      Halfway through executing a plan, the agent discovers that a library does not support what the spec
      assumed. Several tasks depend on that assumption.
    options:
      - text: "Insert a preflight task in the plan template that checks each library assumption before execution."
        level: 3
      - text: "Tell the agent to stub out the missing library call and keep the plan's tests from failing."
        level: 0
      - text: "Add the new constraint to the spec and revise only the dependent tasks after pausing the run."
        level: 2
      - text: "Record the finding in the spec, replan the dependent tasks, and recheck merged work against it."
        level: 3
  - id: agent-verification-1
    skill_id: agent-verification
    situation: >-
      The agent says the feature is finished and all tests pass. You are about to merge.
    options:
      - text: "Run the tests, linter and type check on the branch and read the output before merging."
        level: 2
      - text: "Ignore the agent's summary and require green exit codes from a CI job the agent cannot edit."
        level: 4
      - text: "Merge once the agent's summary says every test passes and reports no failed checks."
        level: 0
      - text: "Wire a Stop hook to run the checks and return any error output to the agent to fix."
        level: 3
      - text: "Check that the CI badge on the pull request is green and skim the diff before merging."
        level: 1
  - id: agent-verification-2
    skill_id: agent-verification
    situation: >-
      You notice the agent made a failing test pass by loosening an assertion and adding a skip. It told
      you everything was green.
    options:
      - text: "Configure a hook that rejects edits to test files during implementation and route test changes to review."
        level: 3
      - text: "Accept the change when the suite is green and skip the test diff when checking the pull request."
        level: 0
      - text: "Gate merges on a protected copy of the acceptance tests stored where the agent has no write access."
        level: 4
      - text: "Add a CI check that fails when skipped tests or assertion counts change against the base branch."
        level: 3
      - text: "Restore the test and add a line to the agent instructions forbidding weakened or skipped tests."
        level: 1
      - text: "Review test diffs separately from code diffs before each merge and reject any weakened assertion."
        level: 2
  - id: tool-use-loop-1
    skill_id: tool-use-loop
    situation: >-
      You need a small assistant that can call two of your own functions. You are asked not to add an agent
      framework, so you call the model API directly.
    options:
      - text: "Record real model responses once and replay them through the loop to check changes offline."
        level: 4
      - text: "Write a prompt asking the model to reply with a JSON function name and parse it with a regex."
        level: 0
      - text: "Write the loop with a maximum turn count and handle several tool calls in one response."
        level: 2
      - text: "Validate arguments against each function schema and return the errors to the model in tool results."
        level: 3
      - text: "Follow the docs example to send tool definitions, run each requested function, and return the results."
        level: 1
  - id: tool-use-loop-2
    skill_id: tool-use-loop
    situation: >-
      Your hand-written loop sometimes fails with an error because the next request contains a tool result
      that does not match the tool call the model made.
    options:
      - text: "Print the message list before each request and compare tool call ids with result ids."
        level: 2
      - text: "Retry the request on failure and log the raw message list when it fails a second time."
        level: 1
      - text: "Add a pre-request check that every call has a matching result and insert an error result when missing."
        level: 3
      - text: "Return exactly one result per tool call id in the next message, including a result when the tool throws."
        level: 2
  - id: agent-sdk-1
    skill_id: agent-sdk
    situation: >-
      You need an agent that reads files, runs commands and keeps its conversation between runs, and you
      would rather not write the tool loop yourself.
    options:
      - text: "Add a custom tool for the internal API and a callback denying writes outside the folder."
        level: 3
      - text: "Install the SDK, run the quick-start example, and swap in the project prompt and folder."
        level: 1
      - text: "Build the agent in a no-code workflow tool with a separate file-reading node and shell node."
        level: 0
      - text: "Log every tool call through a callback and stop the run past a turn or cost budget."
        level: 3
      - text: "Build the agent with the SDK, restrict the allowed tools, and resume sessions by id on later runs."
        level: 2
  - id: agent-sdk-2
    skill_id: agent-sdk
    situation: >-
      Your SDK agent works on your machine, but when you deploy it as a service it should handle several
      users' tasks at once without them seeing each other's files.
    options:
      - text: "Give each user a separate working directory on the same server and a scoped API token."
        level: 2
      - text: "Move session state into a shared store and give every task a throwaway sandbox from a warm pool."
        level: 4
      - text: "Put the agent in one container behind a queue, handling one user's task at a time."
        level: 1
      - text: "Give each session its own container with a private file system and delete it when the run ends."
        level: 3
  - id: mcp-server-build-1
    skill_id: mcp-server-build
    situation: >-
      Your team wants coding agents to query your internal deployment service. There is no ready-made MCP
      server for it.
    options:
      - text: "Shape the tools around tasks agents perform instead of mirroring every endpoint of the API."
        level: 3
      - text: "Generate a server from the OpenAPI spec with a template generator and keep its default tools."
        level: 1
      - text: "Write a shell script that wraps curl calls to the deployment API and let the agent run it."
        level: 0
      - text: "Serve the server over HTTP with auth, input validation, and error messages the model can act on."
        level: 3
      - text: "Build a small server with the official SDK exposing a few described tools over stdio, then test it."
        level: 2
  - id: mcp-server-build-2
    skill_id: mcp-server-build
    situation: >-
      Your MCP server works locally over stdio. Now remote teammates need it, and some of its tools
      must only be available to certain people.
    options:
      - text: "Serve it over HTTP with OAuth and derive both the tool list and each call's checks from IdP groups."
        level: 4
      - text: "Switch to the HTTP transport and require a shared API key distributed to the team."
        level: 2
      - text: "Share the repo and have each teammate run the server locally with personal credentials."
        level: 1
      - text: "Serve it over HTTP with OAuth and check the caller's role inside each sensitive tool before it runs."
        level: 3
  - id: multi-agent-orchestration-1
    skill_id: multi-agent-orchestration
    situation: >-
      You are building a system that researches a topic, drafts a report and checks the draft's claims. One
      big prompt gives shallow, error-prone results.
    options:
      - text: "Build an orchestrator that fans research out to parallel workers, then runs a drafting agent."
        level: 2
      - text: "Extend the single prompt with detailed instructions and a separate example for each of the three stages."
        level: 0
      - text: "Give the checker agent only the draft and the cited sources, and send failed claims back to research."
        level: 4
      - text: "Chain three prompts manually, pasting each stage's output into the next prompt in a shared doc."
        level: 1
      - text: "Wire a research step, a draft step and a checker together in code with fixed handoffs between them."
        level: 2
  - id: multi-agent-orchestration-2
    skill_id: multi-agent-orchestration
    situation: >-
      In your multi-agent pipeline, one worker sometimes returns confident but wrong output, and the next agent
      builds on it. By the end the final answer is wrong and hard to trace.
    options:
      - text: "Define a schema for each agent handoff and fail the run when a worker output violates it."
        level: 3
      - text: "Log each agent's input and output in JSON and trace back to the first step that failed."
        level: 2
      - text: "Run the pipeline again in a clean environment with a test input and compare the new answer with the old one."
        level: 1
      - text: "Place an independent verifier agent after the risky worker to check its claims against sources."
        level: 3
  - id: human-in-the-loop-1
    skill_id: human-in-the-loop
    situation: >-
      Your app lets an agent send emails and delete records for users. Leadership wants a person to confirm
      anything that cannot be undone.
    options:
      - text: "Mark irreversible actions and require a confirmation dialog on them before resuming the run."
        level: 2
      - text: "Put every tool call through one permission check that returns allow, ask or deny per user and tool."
        level: 4
      - text: "Ship it and review the sent emails and deleted records in the audit log every week."
        level: 0
      - text: "Add a rule to the system prompt requiring the model to ask before any irreversible action."
        level: 1
      - text: "Enforce approval in the tool layer, store pending approvals in the database, and wait until resolved."
        level: 3
  - id: human-in-the-loop-2
    skill_id: human-in-the-loop
    situation: >-
      A user starts a long-running agent task in your app, then notices it is heading the wrong way and wants
      to stop it right away.
    options:
      - text: "Check a cancel flag in the loop between steps, and report the steps that already completed."
        level: 2
      - text: "Let the task run to completion and revert its commits with a script if the output fails review."
        level: 0
      - text: "Abort in-flight requests and running tools on cancel, and mark partial changes for review."
        level: 3
      - text: "Add a stop button that closes the connection to the model and ends the run immediately."
        level: 1
  - id: workflow-automation-1
    skill_id: workflow-automation
    situation: >-
      Every day someone copies new support emails into a spreadsheet and tags them by topic. You are asked
      to automate it with a tool that has language model steps.
    options:
      - text: "Route low-confidence tags to a review queue and store the tagging prompt in a variable."
        level: 3
      - text: "Import a template from the tool gallery and connect the mail and spreadsheet accounts."
        level: 1
      - text: "Export the emails to a spreadsheet by hand each morning and check the tags against a dropdown column."
        level: 0
      - text: "Run the workflow on a copy of the sheet with pasted sample emails, and add an error branch that alerts."
        level: 3
      - text: "Set up the workflow with a new-mail trigger, a model prompt that tags the topic, and an append-row step."
        level: 2
  - id: workflow-automation-2
    skill_id: workflow-automation
    situation: >-
      An automation you built occasionally sends a customer the wrong template, because the model step sometimes
      returns text in a format the next node does not expect.
    options:
      - text: "Have the model step return a template id from a fixed list and map ids to templates in code."
        level: 4
      - text: "Add a validation step that parses the output and routes any failures to a manual review queue."
        level: 2
      - text: "Tighten the prompt to require only strict output and include an example of the exact format."
        level: 1
      - text: "Add a structured output schema to the model step and a check on the template name before sending."
        level: 3
