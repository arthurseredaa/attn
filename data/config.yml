# Collect: entries older than this many days are ignored (seeds the evergreen library on first run).
backfill_days: 180
# Label: maximum articles labeled per run (oldest pending first).
label_batch: 20
# Label: delay between sequential labeler calls (between articles), in milliseconds.
label_delay_ms: 4000
# Label: extracted article text is truncated to this many characters before it is sent to the model.
label_max_chars: 20000
# Label: extracted text shorter than this many characters (paywall, JS page) marks the article failed.
label_min_chars: 500
# Label: retry cap. Failed articles are retried on later runs while label_attempts < label_max_attempts.
label_max_attempts: 3
# Label/eval: on a provider overload (HTTP 503/529, "high demand") the same article is retried after each of these
# pauses in milliseconds, so the list length is the retry count; then that article fails and the run continues.
# A 429 quota error is not retried: it stops the run.
label_overload_backoff_ms: [2000, 5000, 10000]
# Label (typesafe-ai/jev only): a skill becomes a secondary skill when jev's probability that the article substantially
# covers it is at least this value (0-1]. Up to 3, highest first, never the primary skill.
jev_secondary_threshold: 0.5
# Pipeline: cron expression for the daily collect + label job.
schedule_cron: "0 6 * * *"
# Quiz: a skill is uncertain when the mean |first-choice level - second-choice level| over its quiz questions is >= this value.
uncertain_spread: 1.5
# Progress: points needed for +1 level (a read of an article with difficulty >= level gives 1 point).
points_per_level: 5
# Feedback: divisor in difficulty_offset = clamp(round((too_easy - too_hard) / offset_k), -1, +1), computed from that skill's feedback events.
offset_k: 3
# Feedback: multiplier applied to the user's per-skill interest on each "not interested" click on an article of that primary skill (not time-based).
interest_decay: 0.8
# Feedback: floor for the per-skill interest.
interest_min: 0.2
# Feed: minimum article quality (0-4) to appear in For you.
quality_min: 2
# Feed: minimum article quality (0-4) for an article whose primary skill is a background skill (not one of the user's focus skills) to appear in For you.
background_quality_min: 4
# Feed: age limit in days; applies only to articles of type release or news (tutorials, deep dives and research have no age limit).
fresh_days: 14
# Feed: articles per page.
page_size: 20
# Feed: priority of an article whose primary skill is a background skill. Focus skill rank r has priority (6 - r) / 5.
background_priority: 0.1
# Feed: fit multiplier when the article difficulty is t + 1 (t = level + difficulty_offset).
fit_next: 1.0
# Feed: fit multiplier when the article difficulty is t.
fit_same: 0.8
# Feed: fit multiplier for any other difficulty inside the uncertain range (t - 1 and t + 2).
fit_stretch: 0.5
