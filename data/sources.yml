# First-party sources only (vendor and practitioner blogs).
# anthropic-news deliberately has no collect-time rule (owner decision): the label-time relevance gate handles it.
# No changelogs, no GitHub releases, no aggregators.
- id: claude-dev
  name: claude.dev
  type: rss
  url: https://claude.dev/rss.xml
- id: anthropic-news
  name: Anthropic News
  type: sitemap
  url: https://www.anthropic.com/sitemap.xml
  path_prefix: /news/
- id: anthropic-engineering
  name: Anthropic Engineering
  type: sitemap
  url: https://www.anthropic.com/sitemap.xml
  path_prefix: /engineering/
- id: mcp-blog
  name: MCP blog
  type: rss
  url: https://blog.modelcontextprotocol.io/index.xml
- id: vercel
  name: Vercel
  type: rss
  url: https://vercel.com/atom
  filter:
    path_prefix: [/blog/]
    keywords: [ai, llm, llms, agent, agents, agentic, mcp, claude, openai, gpt, gemini, ai sdk, ai gateway, v0, inference, embeddings, rag, prompt]
    # Customer stories and accelerator recaps.
    exclude_path_regex: ['^/blog/how-.*-(on-vercel|with-v0|with-vercel)$', 'accelerator']
- id: github-blog-ai
  name: GitHub Blog - AI & ML
  type: rss
  url: https://github.blog/ai-and-ml/feed/
# openai-news is intentionally absent: openai.com article pages are behind a Cloudflare managed challenge
# (HTTP 403) for our honest attn-collector User-Agent, and its RSS blurbs are shorter than label_min_chars.
# Simon Willison: tag feeds instead of the full feed (which is mostly quotes and release notes). Both feeds overlap;
# url uniqueness dedups. The id simon-willison stays with the first feed so existing articles keep their source.
- id: simon-willison
  name: Simon Willison
  type: rss
  url: https://simonwillison.net/tags/ai-assisted-programming.atom
- id: simon-willison-claude-code
  name: Simon Willison (Claude Code)
  type: rss
  url: https://simonwillison.net/tags/claude-code.atom
- id: latent-space
  name: Latent Space
  type: rss
  url: https://www.latent.space/feed
- id: addy-osmani
  name: Addy Osmani
  type: rss
  url: https://addyo.substack.com/feed
- id: hamel-evals
  name: Hamel Husain
  type: rss
  url: https://hamel.dev/index.xml
- id: ai-hero
  name: AI Hero
  type: rss
  url: https://www.aihero.dev/rss.xml
  filter:
    # Landing pages, not articles.
    exclude_paths: [/skills, /skills-catalog, /newsletter, /ai-coding-dictionary, /skills/subscribe]
    exclude_path_prefix: [/workshops/, /ai-coding-dictionary/]
- id: cloudflare-ai
  name: Cloudflare Blog - AI
  type: rss
  url: https://blog.cloudflare.com/tag/ai/rss/
  filter:
    # Company news, not engineering content.
    exclude_title_regex: [birthday, founders, launched during, one year, sovereign, civil society]
- id: philschmid
  name: Philipp Schmid
  type: rss
  url: https://www.philschmid.de/rss
- id: jetbrains-ai
  name: JetBrains AI blog
  type: rss
  url: https://blog.jetbrains.com/ai/feed/
