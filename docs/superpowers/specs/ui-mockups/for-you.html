.ms-opt:hover{background:var(--hover)}

.box{width:16px;height:16px;border:1px solid var(--faint);border-radius:4px;display:grid;place-items:center;flex:none;color:var(--page)}
.box svg{width:12px;height:12px;stroke-width:2.5;opacity:0}

.ms-clear:hover{color:var(--ink)}

function multiSelect(root, options, onChange){
  const selected = new Set();
  root.innerHTML = `<button type="button" class="field ms-btn" aria-haspopup="listbox" aria-expanded="false"><span class="ms-text">Skills</span>${icon("chevron")}</button>
    <div class="ms-pop" role="listbox" aria-multiselectable="true" hidden>
      ${options.map(o => `<label class="ms-opt"><input type="checkbox" value="${esc(o)}"><span class="box">${icon("check")}</span><span>${esc(o)}</span></label>`).join("")}
      <button type="button" class="ms-clear">Clear</button>
    </div>`;
  const btn = root.querySelector(".ms-btn"), pop = root.querySelector(".ms-pop"), text = root.querySelector(".ms-text");
  const paint = () => {
    const arr = [...selected];
    text.innerHTML = arr.length === 0 ? "Skills" : esc(arr[0]) + (arr.length > 1 ? ` <span class="dim">+${arr.length - 1}</span>` : "");
  };
  const open = v => { pop.hidden = !v; btn.setAttribute("aria-expanded", String(v)); };
  btn.addEventListener("click", () => open(pop.hidden));
  pop.addEventListener("change", e => { e.target.checked ? selected.add(e.target.value) : selected.delete(e.target.value); paint(); onChange(selected); });
  root.querySelector(".ms-clear").addEventListener("click", () => { selected.clear(); pop.querySelectorAll("input").forEach(i => i.checked = false); paint(); onChange(selected); });
  document.addEventListener("click", e => { if (!root.contains(e.target)) open(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !pop.hidden){ open(false); btn.focus(); } });
  return selected;
}

function tile(a){
  const p = primary(a);
  if (st.read.has(a.id)) return `<article class="tile is-read" data-id="${a.id}">
    <h2 class="tile-title"><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></h2>
    <div class="tile-foot">
      <span class="read-mark">${icon("check")}Read</span>
      <div class="actions">${actBtn(a,"like","Like","heart")}${actBtn(a,"easy","Too easy","easy")}${actBtn(a,"hard","Too hard","hard")}</div>
    </div></article>`;
  return `<article class="tile" data-id="${a.id}">
    <div class="tile-top">${typeTag(a.type)}<span class="diff-wrap"><span class="mono">${LEVELS[a.d]}</span>${diffBar(a.d)}</span></div>
    <h2 class="tile-title"><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></h2>
    <div class="meta"><span>${esc(a.src)}</span><span class="sep-dot">·</span><span class="mono">${fmtDate(a.pub)}</span><span class="sep-dot">·</span><span class="mono">${minutes(a.wc)} min</span></div>
    <div class="tile-foot">
      <div class="skills"><span class="skill">${esc(p.n)}</span>${moreSkills(a)}</div>
      <div class="actions">${actBtn(a,"like","Like","heart")}${actBtn(a,"easy","Too easy","easy")}${actBtn(a,"hard","Too hard","hard")}${actBtn(a,"x","Not interested","x")}<a class="read-btn" data-act="read" href="${esc(a.url)}" target="_blank" rel="noopener">Read</a></div>
    </div></article>`;
}
function render(){
  const list = ARTICLES.filter(a => !st.removed.has(a.id) && matches(a, st.q, skillSel));
  grid.innerHTML = list.slice(0, st.shown).map(tile).join("");
  document.getElementById("empty").hidden = list.length > 0;
  document.getElementById("more").hidden = list.length <= st.shown;
}
grid.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const card = b.closest(".tile"), id = +card.dataset.id, act = b.dataset.act;
  if (act === "read"){ st.read.add(id); setTimeout(render, 0); return; }
  if (act === "x"){ card.classList.add("leaving"); setTimeout(() => { st.removed.add(id); render(); }, 170); return; }
  if (act === "like"){ st.liked.has(id) ? st.liked.delete(id) : st.liked.add(id); }
  else { st.level.get(id) === act ? st.level.delete(id) : st.level.set(id, act); }
  render();
  const again = grid.querySelector(`.tile[data-id="${id}"] [data-act="${act}"]`); again && again.focus();
});
document.getElementById("q").addEventListener("input", e => { st.q = e.target.value.trim().toLowerCase(); st.shown = PAGE; render(); });
document.getElementById("more").addEventListener("click", () => { st.shown += PAGE; render(); });
render();
</script>
</body>
</html>
