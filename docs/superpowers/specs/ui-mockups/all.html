        --ink: #1a1a18;
        --ink-2: #56544e;
        --muted: #8b8880;
        --rule: #e3e0d8;
        --hover: #eeece6;
        --accent: #c4421a;
        --on-accent: #ffffff;
        --sb: 224px;
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        --paper: #141413;
        --ink: #eceae4;
        --ink-2: #b2afa7;
        --muted: #83807a;
        --rule: #2b2a27;
        --hover: #1e1d1b;
        --accent: #f06a3f;
        --on-accent: #141413;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --paper: #141413;
          --ink: #eceae4;
          --ink-2: #b2afa7;
          --muted: #83807a;
          --rule: #2b2a27;
          --hover: #1e1d1b;
          --accent: #f06a3f;
          --on-accent: #141413;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: 'Hanken Grotesk', system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      svg.i {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      /* app shell */
      .app {
        display: grid;
        grid-template-columns: var(--sb) minmax(0, 1fr);
        min-height: 100vh;
      }
      html.collapsed {
        --sb: 56px;
      }
      .sb {
        position: sticky;
        top: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--rule);
        padding: 14px 10px;
      }
      .sb-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 32px;
        padding-left: 10px;
        margin-bottom: 18px;
      }
      .brand {
        font-weight: 600;
        font-size: 21px;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 34px;
        padding: 0 10px;
        border-radius: 6px;
        color: var(--ink-2);
      }
      .nav a:hover {
        background: var(--hover);
        color: var(--ink);
      }
      .nav a[aria-current='page'] {
        background: var(--hover);
        color: var(--ink);
        font-weight: 500;
      }
      .sb-bottom {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding-left: 6px;
      }
      .user {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .avatar {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        background: var(--ink);
        color: var(--paper);
        display: grid;
        place-items: center;
        font-weight: 600;
        flex: none;
      }
      .ibtn {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border: 0;
        background: none;
        border-radius: 6px;
        color: var(--ink-2);
        cursor: pointer;
        flex: none;
      }
      .ibtn:hover {
        background: var(--hover);
        color: var(--ink);
      }
      .theme .sun {
        display: none;
      }
      :root[data-theme='dark'] .theme .sun {
        display: block;
      }
      :root[data-theme='dark'] .theme .moon {
        display: none;
      }

      html.collapsed .sb {
        padding: 14px 12px;
      }
      html.collapsed .brand,
      html.collapsed .label {
        display: none;
      }
      html.collapsed .sb-top {
        padding: 0;
        justify-content: center;
      }
      html.collapsed .nav a {
        justify-content: center;
        padding: 0;
      }
      html.collapsed .sb-bottom {
        flex-direction: column-reverse;
        padding: 0;
        gap: 10px;
      }

      /* page */
      .main {
        padding: 32px 40px 64px;
        min-width: 0;
      }
      h1 {
        font-size: 21px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 20px;
        line-height: 32px;
      }

      /* controls */
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
      }
      .field {
        height: 34px;
        border: 1px solid var(--rule);
        border-radius: 6px;
        background: transparent;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        color: var(--muted);
      }
      .field:hover {
        border-color: var(--muted);
      }
      .field:focus-within {
        border-color: var(--ink);
      }
      .field input,
      .field select {
        border: 0;
        background: none;
        outline: none;
        height: 100%;
        min-width: 0;
        width: 100%;
        color: var(--ink);
      }
      .field input::placeholder {
        color: var(--muted);
      }
      .search {
        flex: 1 1 220px;
      }
      .ms {
        position: relative;
      }
      .ms > button {
        cursor: pointer;
        width: 100%;
        justify-content: space-between;
        color: var(--ink);
        white-space: nowrap;
      }
      .ms > button span {
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 220px;
      }
      .ms > button[data-empty] span {
        color: var(--muted);
      }
      .ms-pop {
        position: absolute;
        z-index: 5;
        top: 38px;
        left: 0;
        width: 280px;
        max-height: 320px;
        overflow: auto;
        background: var(--paper);
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 4px;
      }
      .ms-pop[hidden] {
        display: none;
      }
      .ms-pop label {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 8px;
        border-radius: 6px;
        cursor: pointer;
        color: var(--ink-2);
      }
      .ms-pop label:hover {
        background: var(--hover);
        color: var(--ink);
      }
      .ms-pop input {
        accent-color: var(--ink);
        margin: 0;
      }

      .btn {
        height: 34px;
        padding: 0 14px;
        border-radius: 6px;
        border: 1px solid var(--rule);
        background: transparent;
        cursor: pointer;
        color: var(--ink);
      }
      .btn:hover {
        background: var(--hover);
      }
      .btn:disabled {
        color: var(--muted);
        cursor: default;
        background: none;
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
        font-weight: 500;
      }
      .btn.primary:hover {
        filter: brightness(1.06);
      }

      /* difficulty */
      .bars {
        display: inline-flex;
        gap: 2px;
        align-items: flex-end;
        flex: none;
      }
      .bars i {
        width: 3px;
        height: 10px;
        background: var(--rule);
      }
      .bars i.on {
        background: var(--ink-2);
      }

      @media (max-width: 700px) {
        :root {
          --sb: 56px;
        }
        .sb {

        .brand,
        .label,
        #collapse {

          font-size: 21px;
          line-height: 1;
        }
        .nav a {
          justify-content: center;
          padding: 0;

        .sb-bottom {

          padding: 0;
          gap: 10px;

        .main {
          padding: 20px 16px 48px;

        .sb-top::before {
          font-size: 19px;

        flex: 3 1 220px;

      .ms {
        flex: 1 1 170px;
        min-width: 0;
      }
      .src {
        flex: 1 1 160px;
        min-width: 0;

        cursor: pointer;
        padding-right: 4px;

      .src select option {
        background: var(--paper);
        color: var(--ink);

      .date {

        flex: none;
      }
      .date input {

      }

        opacity: 0.5;
        cursor: pointer;
      }

      .rows {
        margin-top: 12px;
        border-top: 1px solid var(--rule);
      }
      .row {
        display: grid;
        grid-template-columns: 16px 21px minmax(0, 1fr) 200px 160px 48px 48px;
        align-items: center;
        column-gap: 16px;
        height: 42px;
        padding: 0 8px;
        border-bottom: 1px solid var(--rule);
      }
      .row:hover {
        background: var(--hover);
      }
      .row .ty {
        color: var(--muted);
        display: flex;
      }
      .row .rt {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row .rs {
        color: var(--accent);
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row .rsrc {
        color: var(--ink-2);
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row .rm,
      .row .rd {
        color: var(--muted);
        font-size: 13px;
        text-align: right;
        white-space: nowrap;
      }
      .pager {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 20px;
      }

      @media (max-width: 1100px) {
        .row {
          grid-template-columns: 16px 21px minmax(0, 1fr) 150px 48px 48px;
        }
        .row .rsrc {
          display: none;
        }
      }
      @media (max-width: 700px) {
        .search {
          flex-basis: 100%;
        }
        .ms,
        .src {
          flex: 1 1 calc(50% - 4px);
          min-width: 0;
        }
        .date {
          flex: 1 1 calc(50% - 4px);
          min-width: 0;
        }
        .row {
          grid-template-columns: 16px minmax(0, 1fr);
          grid-template-rows: auto auto;
          height: auto;
          padding: 10px 0;
          row-gap: 4px;
          column-gap: 10px;
        }
        .row .ty {
          grid-row: 1/3;
          align-self: start;
          padding-top: 2px;
        }
        .row .dl {
          display: flex;
        }
        .row .rt {
          grid-column: 2;
          grid-row: 1;
          white-space: normal;
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
        }
        .row .sub {
          grid-column: 2;
          grid-row: 2;
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          column-gap: 8px;
          row-gap: 2px;
          min-width: 0;
        }
        .row .sub .rs {
          flex: 1 1 calc(100% - 40px);
          min-width: 0;
        }
        .row .sub .rsrc {
          display: block;
          flex: 0 1 auto;
          min-width: 0;
          color: var(--muted);
        }
        .row .sub .rm,
        .row .sub .rd {
          flex: none;
          text-align: left;
        }
        .row .sub .rm::before,
        .row .sub .rd::before {
          content: '·';
          margin-right: 8px;
        }
        .date {
          gap: 6px;
        }
        .date input {
          font-size: 13px;
        }
        .date input::-webkit-calendar-picker-indicator {
          display: none;
        }
      }
      @media (min-width: 701px) {
        .row .sub {
          display: contents;
        }
        .row .dl {
          order: 1;
          display: flex;
        }
        .row .rt {
          order: 2;
        }
        .row .rs,
        .row .rsrc,
        .row .rm,
        .row .rd {
          order: 3;
        }
      }

        String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

        const q = new URLSearchParams(location.search);
        let t =
          q.get('theme') ||
          store.get('attn-theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
        if ((q.get('collapsed') ?? store.get('attn-collapsed')) === '1')

      function sidebar(active) {
        const item = (key, href, label) =>
          `<a href="${href}" ${active === key ? 'aria-current="page"' : ''} title="${label}">${ic(ICON[key])}<span class="label">${label}</span></a>`;

      }
      function wireSidebar() {
        document.getElementById('theme').onclick = () => {
          const r = document.documentElement,
            t = r.dataset.theme === 'dark' ? 'light' : 'dark';
          r.dataset.theme = t;
          store.set('attn-theme', t);
        };
        document.getElementById('collapse').onclick = () => {
          const c = document.documentElement.classList.toggle('collapsed');
          store.set('attn-collapsed', c ? '1' : '0');
        };
      }

      const SKILLS = [...new Set(ARTICLES.flatMap((a) => a.k.map((s) => s[0])))].sort((a, b) => a.localeCompare(b));
      function multiSelect(el, onChange) {
        const sel = new Set();
        el.innerHTML = `<button type="button" class="field" aria-haspopup="true" aria-expanded="false" data-empty><span>Skills</span>${ic(ICON.chevron)}</button>
    <div class="ms-pop" hidden>${SKILLS.map((s) => `<label><input type="checkbox" value="${esc(s)}">${esc(s)}</label>`).join('')}</div>`;
        const btn = el.querySelector('button'),
          pop = el.querySelector('.ms-pop'),
          lab = btn.querySelector('span');
        const open = (v) => {
          pop.hidden = !v;
          btn.setAttribute('aria-expanded', v);
        };
        btn.onclick = (e) => {
          e.stopPropagation();
          open(pop.hidden);
        };
        pop.onclick = (e) => e.stopPropagation();
        document.addEventListener('click', () => open(false));
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') open(false);
        });
        pop.onchange = (e) => {
          e.target.checked ? sel.add(e.target.value) : sel.delete(e.target.value);
          lab.textContent = sel.size ? [...sel].join(', ') : 'Skills';
          sel.size ? btn.removeAttribute('data-empty') : btn.setAttribute('data-empty', '');
          onChange(sel);
        };
        return sel;
      }
      const matches = (a, q, skills) =>
        (!q || a.t.toLowerCase().includes(q)) && (!skills.size || a.k.some((s) => skills.has(s[0])));

      <main class="main">

          <label class="field src"
            ><select id="src" aria-label="Source">
              <option value="">All sources</option></select
            ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg
          ></label>
          <label class="field date"><span>From</span><input type="date" id="from" class="num" /></label>
          <label class="field date"><span>To</span><input type="date" id="to" class="num" /></label>
        </div>
        <div class="rows" id="rows" role="list"></div>
        <div class="pager">
          <button class="btn" id="newer">Newer</button>
          <button class="btn" id="older">Older</button>
        </div>
      </main>
    </div>
    <script>
      wireSidebar();
      const PAGE = 15;
      let page = 0,
        q = '',
        skills = new Set(),
        src = '',
        from = '',
        to = '';
      const rows = document.getElementById('rows'),
        newer = document.getElementById('newer'),
        older = document.getElementById('older');
      const srcSel = document.getElementById('src');
      [...new Set(ARTICLES.map((a) => a.s))]
        .sort((a, b) => a.localeCompare(b))
        .forEach((s) => srcSel.add(new Option(s, s)));

      function rowHTML(a) {
        const p = (a.k.find((k) => k[1]) || a.k[0])[0];
        return `<a class="row" role="listitem" href="${esc(a.u)}" target="_blank" rel="noopener">
    <span class="ty" title="${TYPES[a.y]}">${ic(ICON[a.y])}</span>
    <span class="rt">${esc(a.t)}</span>
    <span class="sub">
      <span class="dl" title="${LEVELS[a.l]}">${bars(a.l)}</span>
      <span class="rs">${esc(p)}</span>
      <span class="rsrc">${esc(a.s)}</span>
      <span class="rm num">${mins(a.w)} min</span>
      <span class="rd num">${fmtDate(a.d)}</span>
    </span></a>`;
      }
      function render() {
        const list = ARTICLES.filter(
          (a) => matches(a, q, skills) && (!src || a.s === src) && (!from || a.d >= from) && (!to || a.d <= to),
        );
        const pages = Math.max(1, Math.ceil(list.length / PAGE));
        page = Math.min(page, pages - 1);
        rows.innerHTML = list
          .slice(page * PAGE, page * PAGE + PAGE)
          .map(rowHTML)
          .join('');
        newer.disabled = page === 0;
        older.disabled = page >= pages - 1;
      }
      const reset = () => {
        page = 0;
        render();
      };
      document.getElementById('q').oninput = (e) => {
        q = e.target.value.trim().toLowerCase();
        reset();
      };
      srcSel.onchange = (e) => {
        src = e.target.value;
        reset();
      };
      document.getElementById('from').onchange = (e) => {
        from = e.target.value;
        reset();
      };
      document.getElementById('to').onchange = (e) => {
        to = e.target.value;
        reset();
      };
      skills = multiSelect(document.getElementById('skills'), (s) => {
        skills = s;
        reset();
      });
      newer.onclick = () => {
        page--;
        render();
        scrollTo(0, 0);
      };
      older.onclick = () => {
        page++;
        render();
        scrollTo(0, 0);
      };
      render();
    </script>
